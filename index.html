  {t:"Film", e:"🎬", n:"Kikujiro", d:"116 minuti", x:"Un bambino cerca la madre, un delinquente scontroso lo accompagna, e la colonna sonora di Joe Hisaishi fa metà del lavoro. Kitano che gira una commedia dolcissima dopo anni di film violenti. Da vedere quando serve una cosa gentile ma non stupida.", c:"Kikujiro Takeshi Kitano film"},
  {t:"Respiro", e:"🌬️", n:"Respirazione quadrata", d:"5 minuti", x:"Inspira per quattro, trattieni per quattro, espira per quattro, resta vuota per quattro. Ripeti disegnando mentalmente un quadrato, un lato per tempo. È quello che insegnano ai sommozzatori e ai tiratori: serve a stare fermi quando la testa vuole correre.", c:""},
  {t:"Libro", e:"📖", n:"Cuore di cane — Bulgakov", d:"130 pagine", x:"Un cane randagio viene trasformato in uomo da un professore moscovita e diventa un burocrate insopportabile. Satira feroce, ma si legge come una favola. In due sere è finito e ti lascia di buonumore.", c:"Cuore di cane Bulgakov"},
  {t:"Musica", e:"🎧", n:"The Köln Concert — Keith Jarrett", d:"66 minuti", x:"Registrato nel 1975 su un pianoforte sbagliato, scordato e troppo piccolo, che l'organizzatrice diciassettenne non era riuscita a sostituire. Jarrett suonò lo stesso, tutto improvvisato, evitando le note che non funzionavano. È il disco per piano solo più venduto della storia.", c:"Keith Jarrett Koln Concert"},
  {t:"Rituale", e:"📓", n:"Le tre righe della sera", d:"5 minuti", x:"Prima di dormire scrivi tre righe: una cosa successa, una cosa che hai pensato, una cosa che vuoi fare domani. Non tenere un diario, tieni un registro. La differenza è che il registro non ti chiede di essere interessante.", c:""},
  {t:"Yoga", e:"🧘", n:"Il gatto e la mucca", d:"4 minuti", x:"A quattro zampe, inarca la schiena verso l'alto espirando e poi lasciala scendere inspirando. Avanti e indietro, lentamente, dieci volte. È il movimento più semplice che esista per svegliare una schiena rigida, e si può fare anche in pigiama sul tappeto.", c:"marjariasana gatto mucca yoga"},
  {t:"Quadro", e:"🖼️", n:"Ragazza alla finestra — Dalí", d:"3 minuti", x:"Dalí a ventitré anni, prima dei baffi e degli orologi molli: sua sorella Ana María di spalle che guarda la baia di Cadaqués. Solo azzurri e bianchi. È la prova che sapeva dipingere in modo normale e ha scelto di non farlo.", c:"Figura alla finestra Dali Ana Maria"},
  {t:"Film", e:"🎬", n:"Il postino", d:"108 minuti", x:"Neruda in esilio su un'isola italiana e il postino che gli porta la posta e impara le metafore. Troisi lo girò già malato e morì il giorno dopo la fine delle riprese. Da vedere una volta ogni tanti anni, mai troppo spesso.", c:"Il postino Troisi film 1994"},
  {t:"Libro", e:"📖", n:"Il vecchio e il mare — Hemingway", d:"120 pagine", x:"Un vecchio pescatore, un pesce enorme e nient'altro. Frasi corte e nessun aggettivo di troppo. Gli valse il Nobel, e si legge in un pomeriggio d'estate all'ombra senza mai perdere il filo.", c:"Il vecchio e il mare Hemingway"},
  {t:"Musica", e:"🎧", n:"Concerto per violino e oboe — Bach", d:"15 minuti", x:"BWV 1060, il movimento centrale in particolare. Bach lo scrisse per due strumenti che si rincorrono senza mai sovrapporsi. Se la musica classica di solito ti stanca, questa dura un quarto d'ora e non chiede niente.", c:"Bach BWV 1060 adagio oboe violino"},
  {t:"Rituale", e:"🚶", n:"Il giro dell'isolato", d:"12 minuti", x:"Esci senza meta e senza cuffie e fai il giro dell'isolato, anche se è brutto, anche se piove, anche se è buio. Il punto non è camminare: è che i problemi visti da in piedi e in movimento hanno una forma diversa da quelli visti seduti.", c:""},
  {t:"Yoga", e:"🧘", n:"Savasana per davvero", d:"8 minuti", x:"Sdraiata sulla schiena, braccia lungo il corpo, palmi in su, piedi che cadono verso l'esterno. Sembra la parte facile ed è la più difficile, perché non c'è niente da fare. Metti un timer così non controlli l'ora, e resta lì.", c:"savasana posizione del cadavere"},
  {t:"Quadro", e:"🖼️", n:"Nighthawks — Edward Hopper", d:"3 minuti", x:"Un bar aperto di notte visto da fuori, quattro persone, nessuna porta visibile per entrare o uscire. Hopper disse che forse aveva dipinto inconsciamente la solitudine di una grande città. Guarda quanto è verde la luce: nel 1942 i tubi al neon erano ancora una novità.", c:"Nighthawks Edward Hopper"},
  {t:"Film", e:"🎬", n:"Storie di fantasmi giapponesi", d:"a episodi", x:"Kwaidan di Kobayashi, quattro racconti indipendenti girati interamente in studio con cieli dipinti a mano. Non fa paura nel modo in cui te lo aspetti: è lentissimo e bellissimo, e si può guardare un episodio per sera.", c:"Kwaidan Kobayashi 1964 film"},
  {t:"Respiro", e:"🌬️", n:"Contare le espirazioni", d:"6 minuti", x:"Non contare i respiri: conta solo le espirazioni, da uno a dieci, e poi ricomincia. Quando ti accorgi di essere arrivata a diciassette pensando ad altro, ricominci da uno senza arrabbiarti. È tutta qui la pratica, e funziona proprio perché ti perdi.", c:""},
  {t:"Rituale", e:"🕯️", n:"Spegnere le luci grandi", d:"tutta la sera", x:"Dopo cena spegni il lampadario e accendi solo le lampade basse. È una cosa da niente e cambia completamente il modo in cui il corpo capisce che la giornata sta finendo. La luce dall'alto dice ancora ufficio, la luce di lato dice finalmente.", c:""}

RELAX.push(
{t:"Yoga",e:"🧘",n:"Piegamento in avanti da seduta",d:"6 minuti",x:"Seduta a gambe distese, lasciati andare in avanti senza cercare di toccare i piedi: l'obiettivo non è arrivare, è restare. Piega le ginocchia quanto serve. Cinque respiri lunghi, e a ogni espirazione scendi di un millimetro.",c:"paschimottanasana yoga"},
{t:"Yoga",e:"🧘",n:"Il cane a testa in giù",d:"4 minuti",x:"Mani e piedi a terra, sedere verso l'alto, corpo a V rovesciata. Pedala con i talloni per sciogliere i polpacci. È faticosa i primi trenta secondi e riposante dopo il primo minuto.",c:"adho mukha svanasana yoga"},
{t:"Yoga",e:"🧘",n:"La farfalla",d:"7 minuti",x:"Seduta, piante dei piedi unite e ginocchia che cadono verso l'esterno. Non spingere: lascia che la gravità faccia il lavoro. Se le ginocchia restano alte va benissimo, mettici due cuscini sotto.",c:"baddha konasana yoga"},
{t:"Yoga",e:"🧘",n:"Torsione sdraiata",d:"6 minuti",x:"Sdraiata sulla schiena, porta un ginocchio piegato dall'altra parte del corpo e gira la testa nella direzione opposta. Tre minuti per lato. È la posizione migliore da fare a letto prima di dormire.",c:"supta matsyendrasana yoga"},
{t:"Yoga",e:"🧘",n:"La montagna",d:"3 minuti",x:"In piedi, piedi paralleli, peso distribuito su tutta la pianta. Sembra non fare niente e invece è il punto zero di tutto lo yoga: senti dove stai appoggiando davvero il peso, di solito è sbilanciato.",c:"tadasana yoga"},
{t:"Yoga",e:"🧘",n:"Allungamento del collo",d:"4 minuti",x:"Seduta, lascia cadere l'orecchio verso la spalla e appoggia la mano sulla testa senza tirare: il peso della mano basta. Trenta secondi per lato, due volte. Se lavori al computer questo è il minimo sindacale.",c:""},
{t:"Respiro",e:"🌬️",n:"Respirazione a narici alternate",d:"6 minuti",x:"Chiudi la narice destra col pollice, inspira a sinistra. Chiudi entrambe, pausa. Apri la destra ed espira. Poi al contrario. Nove cicli. Nella tradizione serve a bilanciare i due lati; nella pratica, rallenta tutto.",c:"nadi shodhana respirazione"},
{t:"Respiro",e:"🌬️",n:"Respiro dell'oceano",d:"5 minuti",x:"Respira dal naso stringendo leggermente la gola, come quando appanni uno specchio ma a bocca chiusa. Fa un suono simile alla risacca. È il respiro che si usa in tutta la pratica yoga, e da solo funziona uguale.",c:"ujjayi respirazione"},
{t:"Respiro",e:"🌬️",n:"Espirare il doppio",d:"4 minuti",x:"Qualunque sia il tuo ritmo, fai durare l'espirazione il doppio dell'inspirazione. Se inspiri per tre, espira per sei. Non contare oltre: è l'unica regola. Funziona in fila alla posta come a letto.",c:""},
{t:"Respiro",e:"🌬️",n:"Il respiro sul palmo",d:"3 minuti",x:"Appoggia una mano sul petto e una sulla pancia. Respira finché si muove solo quella sulla pancia. La maggior parte delle persone da adulta respira solo di petto, e questo da solo tiene alta l'allerta tutto il giorno.",c:""},
{t:"Quadro",e:"🖼️",n:"L'onda di Kanagawa — Hokusai",d:"3 minuti",x:"Non è una stampa singola ma la prima di trentasei vedute del Monte Fuji. Guarda in fondo, in mezzo all'onda: il Fuji è lì, piccolissimo, ed è il vero soggetto. Hokusai aveva settantun anni.",c:"La grande onda di Kanagawa Hokusai"},
{t:"Quadro",e:"🖼️",n:"Le ninfee — Monet",d:"4 minuti",x:"Monet ne dipinse circa duecentocinquanta negli ultimi trent'anni di vita, mentre perdeva la vista per la cataratta. I quadri tardivi sono più astratti proprio per questo. Le grandi tele all'Orangerie di Parigi si guardano seduti in mezzo.",c:"Ninfee Monet Orangerie"},
{t:"Quadro",e:"🖼️",n:"Ragazza con l'orecchino di perla — Vermeer",d:"3 minuti",x:"Non è un ritratto ma un tronie, uno studio di espressione. Guarda solo il punto di luce sul labbro: Vermeer ci ha messo un tocco di bianco puro, ed è quello che rende il quadro vivo.",c:"Ragazza con turbante Vermeer"},
{t:"Quadro",e:"🖼️",n:"Il bacio — Klimt",d:"3 minuti",x:"L'oro non è colore ma foglia vera. Guarda i piedi di lei sul bordo del prato: sono aggrappati al ciglio di un precipizio, cosa che quasi nessuno nota.",c:"Il bacio Klimt"},
{t:"Quadro",e:"🖼️",n:"Il viandante sul mare di nebbia — Friedrich",d:"3 minuti",x:"L'immagine del romanticismo per antonomasia. Il trucco è che l'uomo è di spalle: sei tu a guardare quel panorama, non lui. Del 1818.",c:"Viandante sul mare di nebbia Friedrich"},
{t:"Quadro",e:"🖼️",n:"La ronda di notte — Rembrandt",d:"4 minuti",x:"Non è affatto notturna: sembrava scura per secoli di vernice ingiallita. Dopo il restauro si è scoperto che è una scena diurna. È anche stato tagliato ai lati per farlo entrare in una stanza.",c:"Ronda di notte Rembrandt"},
{t:"Quadro",e:"🖼️",n:"Impressione, levar del sole — Monet",d:"3 minuti",x:"Da questo titolo un critico coniò per scherno la parola impressionismo. Il sole arancione ha esattamente la stessa luminosità del cielo grigio: in bianco e nero sparisce.",c:"Impression soleil levant Monet"},
{t:"Quadro",e:"🖼️",n:"Autoritratto con collana di spine — Frida Kahlo",d:"3 minuti",x:"Dipinto poco dopo il divorzio da Rivera. La scimmia, il gatto nero e il colibrì morto sono tutti simboli precisi. Frida diceva di dipingere se stessa perché era il soggetto che conosceva meglio.",c:"Frida Kahlo autoritratto collana di spine"},
{t:"Film",e:"🎬",n:"Il mio vicino Totoro",d:"86 minuti",x:"Non c'è nessun cattivo, nessun conflitto, nessuna minaccia. Miyazaki voleva fare un film in cui non succedesse niente di brutto. È l'antidoto giusto dopo una settimana pesante.",c:"Il mio vicino Totoro film"},
{t:"Film",e:"🎬",n:"Little Forest",d:"due film, 100 min ciascuno",x:"Una ragazza torna al villaggio e per due film cucina, coltiva, aspetta le stagioni. Esiste in versione giapponese e coreana, entrambe buone. Il cinema più calmo mai prodotto.",c:"Little Forest film 2014"},
{t:"Film",e:"🎬",n:"Paterson",d:"118 minuti",x:"Un autista di autobus scrive poesie. Una settimana della sua vita, sette giorni quasi identici. Jarmusch che dimostra che la ripetizione può essere consolante.",c:"Paterson Jim Jarmusch film"},
{t:"Film",e:"🎬",n:"Il pranzo di Babette",d:"102 minuti",x:"Una cuoca francese esiliata spende tutta una vincita in una sola cena per gente che non la apprezzerà. Il film più sensuale mai girato su qualcuno che cucina.",c:"Il pranzo di Babette film"},
{t:"Film",e:"🎬",n:"Chef — La ricetta perfetta",d:"114 minuti",x:"Uno chef licenziato compra un furgone e ricomincia. Prevedibile, allegro e pieno di panini alla griglia. Non tutti i film devono essere difficili.",c:"Chef film 2014 Jon Favreau"},
{t:"Libro",e:"📖",n:"Il vecchio e il mare — Hemingway",d:"120 pagine",x:"Un pomeriggio d'estate all'ombra e sei a posto. Frasi corte, nessun aggettivo di troppo, e una tensione che non cala mai nonostante non succeda quasi niente.",c:"Il vecchio e il mare Hemingway"},
{t:"Libro",e:"📖",n:"Walden — Thoreau",d:"da leggere a pezzi",x:"Due anni in una capanna nel bosco, raccontati senza fretta. Non va letto tutto d'un fiato: apri un capitolo la sera, chiudi, ricomincia domani. È fatto apposta.",c:"Walden Thoreau"},
{t:"Libro",e:"📖",n:"Il mondo di ieri — Zweig",d:"400 pagine",x:"L'Europa prima delle due guerre raccontata da chi l'ha vista finire. Lo scrisse in esile e si tolse la vita subito dopo averlo spedito. Malinconico e stranamente rasserenante.",c:"Il mondo di ieri Stefan Zweig"},
{t:"Libro",e:"📖",n:"Le città invisibili — Calvino",d:"due pagine per volta",x:"Cinquantacinque città che non esistono. Si apre a caso, si leggono due pagine, si chiude. È l'unico libro davvero progettato per essere usato così.",c:"Le città invisibili Calvino"},
{t:"Libro",e:"📖",n:"Poesie — Wisława Szymborska",d:"una poesia per sera",x:"Nobel 1996. Scriveva come se stesse chiacchierando e poi ti lasciava con una frase che non ti aspettavi. Una poesia prima di dormire e basta.",c:"Wislawa Szymborska poesie"},
{t:"Musica",e:"🎧",n:"Suites per violoncello — Bach",d:"un movimento alla volta",x:"Furono considerate esercizi tecnici per due secoli, finché Pablo Casals non trovò lo spartito in un negozio di Barcellona e ci lavorò dodici anni prima di suonarle in pubblico.",c:"Bach Suites violoncello Casals"},
{t:"Musica",e:"🎧",n:"Spiegel im Spiegel — Arvo Pärt",d:"9 minuti",x:"Pianoforte e violino, tre note per volta. Pärt lo compose dopo otto anni di silenzio in cui aveva smesso di scrivere per ripensare tutto da capo.",c:"Arvo Part Spiegel im Spiegel"},
{t:"Musica",e:"🎧",n:"Kind of Blue — Miles Davis",d:"46 minuti",x:"Registrato in due sessioni, quasi tutto in prima take, con i musicisti che vedevano gli spartiti per la prima volta. È il disco jazz più venduto della storia.",c:"Miles Davis Kind of Blue"},
{t:"Musica",e:"🎧",n:"Vespro della Beata Vergine — Monteverdi",d:"a pezzi",x:"Del 1610, e suona modernissimo. Se la musica sacra ti sembra noiosa, comincia dal Nisi Dominus e cambia idea in sette minuti.",c:"Monteverdi Vespro 1610"},
{t:"Musica",e:"🎧",n:"Sacred Spirit / canti gregoriani",d:"quanto serve",x:"Il canto gregoriano ha una caratteristica misurata: non ha un ritmo forte, quindi il corpo non prova a seguirlo. È il motivo per cui si lavora e si legge bene con quello di sottofondo.",c:"canto gregoriano"},
{t:"Rituale",e:"📻",n:"Un'ora senza schermi",d:"60 minuti",x:"Non prima di dormire, che è troppo facile: falla nel mezzo del pomeriggio, quando è scomodo. Metti il telefono in un'altra stanza e vedi cosa fai. Le prime tre volte sarà noioso e poi non più.",c:""},
{t:"Rituale",e:"🛁",n:"Il bagno con il sale",d:"25 minuti",x:"Due manciate di sale grosso o di Epsom nell'acqua calda. Niente telefono, portati un libro anche se poi si bagna. L'effetto sui muscoli è reale, quello sulla testa lo è ancora di più.",c:""},
{t:"Rituale",e:"🧹",n:"Riordinare una superficie sola",d:"15 minuti",x:"Non tutta la casa: un tavolo, una mensola, il comodino. Il cervello legge il disordine come compiti non finiti, e ripulire una superficie che vedi spesso ha un effetto sproporzionato rispetto alla fatica.",c:""},
{t:"Rituale",e:"☕",n:"La colazione seduta",d:"20 minuti",x:"Non in piedi, non mentre fai altro, non con il telefono. Venti minuti seduta a un tavolo. Sembra un consiglio banale finché non provi a farlo per una settimana intera.",c:""},
{t:"Rituale",e:"🌇",n:"Guardare fuori dalla finestra",d:"10 minuti",x:"Senza obiettivo, senza musica, senza commentare. Gli oftalmologi lo consigliano per riposare gli occhi, che dopo ore a fuoco vicino hanno bisogno di guardare lontano. Il resto viene in omaggio.",c:""},
{t:"Rituale",e:"📮",n:"Scrivere una lettera vera",d:"30 minuti",x:"A mano, su carta, con un francobollo. Scrivere lentamente cambia il modo in cui pensi le frasi: non puoi cancellare, quindi rifletti prima. E chi la riceve la tiene per anni.",c:""},
{t:"Rituale",e:"🌿",n:"Occuparsi di una pianta",d:"10 minuti",x:"Togli le foglie secche, gira il vaso, controlla la terra col dito. Prendersi cura di una cosa viva che non chiede niente e non ringrazia è una forma di meditazione che nessuno chiama così.",c:""}
);

CURIOSITA.push(
["Il Sole impiega 8 minuti a raggiungerci","La luce che vedi adesso è partita otto minuti e venti secondi fa. Se il Sole si spegnesse, ce ne accorgeremmo solo dopo."],
["Gli struzzi non nascondono la testa nella sabbia","Girano le uova nel nido con il becco, e da lontano sembra che si nascondano. La leggenda risale a Plinio il Vecchio."],
["Il nome Everest non è il nome vero","In Nepal si chiama Sagarmatha, in Tibet Chomolungma. Everest era il cognome di un funzionario britannico che non lo vide mai."],
["Il pomodoro in Italia è arrivato tardi","Prima del Cinquecento in Italia non c'era, e per due secoli fu considerato ornamentale e forse velenoso. La cucina italiana come la conosci ha meno di trecento anni."],
["Le zebre sono nere con le strisce bianche","La pelle sotto il pelo è scura: il bianco è il pigmento che manca, non il contrario."],
["Una giornata terrestre si allunga","La Luna frena impercettibilmente la rotazione della Terra. Ai tempi dei dinosauri il giorno durava circa 23 ore."],
["I diamanti non sono rari","Sono relativamente comuni. La loro scarsità è stata costruita nel Novecento con un controllo rigido dell'offerta e una campagna pubblicitaria."],
["Il primo computer bug era un insetto vero","Una falena finì in un relè dell'Harvard Mark II nel 1947. Fu incollata nel registro con la scritta 'primo caso reale di bug trovato'."],
["Il Sahara era verde","Fino a circa seimila anni fa era una savana con laghi e ippopotami. Le pitture rupestri lo dimostrano: mostrano gente che nuota."],
["Un cucchiaino di stella di neutroni",'Peserebbe circa un miliardo di tonnellate. È la materia più densa che conosciamo dopo i buchi neri.'],
["Il cuore delle balene blu","Pesa circa 180 chili e batte da 8 a 10 volte al minuto quando l'animale è in immersione. Si sente a chilometri di distanza."],
["Le lingue si estinguono ogni due settimane","Delle circa settemila lingue parlate oggi, si stima che metà sparirà entro fine secolo."],
["La Groenlandia è quasi tutta ghiaccio","Se si sciogliesse, il livello dei mari salirebbe di circa sette metri. Il nome fu una trovata pubblicitaria di Erik il Rosso per attirare coloni."],
["Il vetro si può riciclare all'infinito","Non perde qualità a nessun ciclo, a differenza di carta e plastica. Una bottiglia può tornare bottiglia per sempre."],
["Le formiche non dormono come noi","Molte specie fanno centinaia di micro-sonni di pochi minuti al giorno. Le regine dormono di più delle operaie."],
["Il caffè è tecnicamente un frutto","Il chicco è il seme di una drupa rossa simile a una ciliegia. La polpa si può mangiare ed è dolciastra."],
["Il primo film della storia dura 2 secondi","La 'Roundhay Garden Scene' del 1888 mostra quattro persone che camminano in giardino. Uno di loro morì undici giorni dopo."],
["I gatti domestici sono arrivati da soli","Non sono stati addomesticati: si sono avvicinati ai granai per i topi e sono rimasti. È un'auto-addomesticazione."],
["Il DNA umano e quello della banana","Condividono circa il 60% dei geni. La cosa dice più su quanto sia conservativa l'evoluzione che su noi e le banane."],
["Il Titanic aveva abbastanza scialuppe per legge","Le norme dell'epoca erano basate sul tonnellaggio, non sul numero di passeggeri. Erano legali e assolutamente insufficienti."],
["Gli alberi comunicano sottoterra","Le reti di funghi micorrizici collegano le radici e trasferiscono nutrienti e segnali chimici tra piante diverse, anche di specie diverse."],
["Il sale marino e il sale di miniera","Vengono dalla stessa fonte: le miniere di salgemma sono mari evaporati milioni di anni fa. Chimicamente sono quasi identici."],
["Nessuno sa perché sbadigliamo","Ci sono almeno cinque teorie principali e nessuna prova definitiva. Sappiamo solo che è contagioso, anche tra specie diverse."],
["La Grande Muraglia non si vede dallo spazio","È troppo stretta. La leggenda circolava già prima che qualcuno andasse in orbita a controllare."],
["Il numero di battiti cardiaci","La maggior parte dei mammiferi vive circa un miliardo di battiti, dal topo all'elefante. Gli esseri umani, con la medicina moderna, ne fanno molti di più."],
["Il ghiaccio dell'Antartide contiene aria antica","Le bolle intrappolate nelle carote di ghiaccio conservano l'atmosfera di ottocentomila anni fa. È così che si ricostruisce il clima del passato."],
["Il rosso non esiste nell'arcobaleno puro","L'arcobaleno mostra lo spettro visibile continuo. Il rosa e il magenta, invece, non ci sono affatto: il cervello li costruisce."],
["I fulmini colpiscono la Terra 100 volte al secondo","Circa otto milioni di fulmini al giorno. La maggior parte cade sulle terre emerse tropicali, non sul mare."],
["Il primo messaggio via internet fu incompleto","Nel 1969 si voleva scrivere LOGIN. Il sistema si bloccò dopo LO. È stato definito un inizio biblico non voluto."],
["Le impronte digitali si formano nel grembo","Dipendono anche dalla posizione del feto e dalla pressione del liquido amniotico. Nemmeno i gemelli identici le hanno uguali."],
["Il vetro delle finestre antiche","Non cola verso il basso: quella è una leggenda. Le lastre erano irregolari alla produzione e venivano montate col lato spesso in basso per stabilità."],
["I polpi assaggiano con le ventose","Hanno recettori chimici sulle braccia: toccano e sentono il sapore contemporaneamente. Due terzi dei loro neuroni sono fuori dal cervello."],
["Il Mar Morto si sta abbassando","Perde più di un metro all'anno perché il Giordano viene deviato per l'irrigazione. Le rive di cinquant'anni fa oggi sono chilometri lontane dall'acqua."],
["Il paradosso del compleanno","In un gruppo di 23 persone c'è oltre il 50% di probabilità che due condividano il compleanno. Con 70 persone si sale al 99,9%."],
["Le rondini non passano l'inverno nel fango","Fino al Settecento si credeva che ibernassero nel fango degli stagni. Solo con l'inanellamento si scoprì che arrivavano in Africa."],
["Il colore delle uova dipende dalla gallina","Il colore del guscio è determinato dalla razza e non ha alcuna relazione con il valore nutritivo o il sapore."],
["Il numero pi greco nella natura","Il rapporto tra la lunghezza reale di un fiume e la distanza in linea d'aria tra sorgente e foce tende, mediamente, a pi greco."],
["Il ghiaccio galleggia ed è un'anomalia","Quasi tutte le sostanze sono più dense da solide. Se il ghiaccio non galleggiasse, i laghi gelerebbero dal fondo e la vita acquatica non esisterebbe."],
["Il primo vaccino veniva dalle mucche","Jenner notò che le mungitrici non prendevano il vaiolo. La parola vaccino viene proprio da vacca."],
["Le carote non erano arancioni","Le varietà antiche erano viola, bianche e gialle. L'arancione fu selezionato in Olanda nel Seicento e poi si è imposto ovunque."],
["Un anno su Nettuno","Dura 165 anni terrestri. Da quando è stato scoperto nel 1846, ha completato un solo giro intorno al Sole, nel 2011."],
["Il suono più forte mai registrato","L'eruzione del Krakatoa nel 1883 si sentì a 4800 chilometri di distanza e fece il giro del globo quattro volte come onda di pressione."],
["I libri hanno un odore chimico preciso","Deriva dalla decomposizione della lignina e della cellulosa, che rilasciano composti simili a vaniglia e mandorla. Ha anche un nome: odore di libro vecchio."],
["Gli occhi delle capre","Hanno pupille rettangolari orizzontali che restano parallele al terreno anche quando abbassano la testa. Serve a vedere i predatori a 320 gradi."],
["Il primo pixel della storia","Il termine fu coniato nel 1965. La prima immagine digitale scansionata, del 1957, era la foto del figlio di un ingegnere: 176 per 176 pixel."],
["Le stelle marine non hanno cervello","Hanno un anello nervoso e nessun organo centrale. E possono rigenerare un intero corpo da un braccio, se contiene parte del disco centrale."],
["Il pane a lievitazione naturale è più antico del lievito","Gli egizi lo facevano quattromila anni fa con fermentazioni spontanee. Il lievito di birra industriale ha meno di duecento anni."],
["Il campo magnetico terrestre si è invertito","Molte volte, l'ultima circa 780.000 anni fa. Si registra nelle rocce vulcaniche, che congelano l'orientamento magnetico del momento."],
["La velocità del suono cambia col caldo","È più veloce nell'aria calda. È il motivo per cui i suoni lontani si sentono meglio in certe sere d'estate."],
["Il primo emoji è del 1999","Ne furono creati 176, tutti in una griglia di 12 per 12 pixel, per un operatore telefonico giapponese. Ora sono al MoMA."],
["Il cuore dei gamberetti sta nella testa","Come in molti crostacei, l'organo circolatorio è nel cefalotorace, insieme a stomaco e cervello."],
["I quadri di Van Gogh venduti in vita","Le fonti concordano che ne vendette pochissimi, forse uno solo. Oggi sono tra le opere più costose mai battute all'asta."],
["Il tempo passa più veloce in montagna","La relatività generale prevede che il tempo scorra leggermente più in fretta più lontano dalla massa terrestre. È stato misurato con orologi atomici a pochi metri di dislivello."],
["Il basilico e la menta sono parenti","Appartengono entrambe alle Lamiaceae, come rosmarino, salvia, timo, origano e lavanda. Hanno tutte il fusto quadrato: prova a toccarlo."],
["Il primo semaforo esplose","Installato a Londra nel 1868, funzionava a gas e saltò in aria dopo poche settimane ferendo il vigile. Si tornò ai semafori solo cinquant'anni dopo."],
["La lingua della giraffa è blu-viola","Si pensa che la pigmentazione protegga dal sole, dato che la tiene fuori per ore mangiando. È lunga circa mezzo metro."],
["L'acqua calda può congelare prima della fredda","È l'effetto Mpemba, osservato fin dai tempi di Aristotele e ancora non spiegato del tutto. Dipende da molte condizioni."],
["Il nome dei giorni della settimana","Vengono dai pianeti classici: Luna, Marte, Mercurio, Giove, Venere, Saturno, Sole. In italiano il sabato e la domenica sono stati sostituiti da nomi religiosi."],
["I bambini nascono con più ossa","Circa 300, che poi si fondono fino alle 206 dell'adulto. Il cranio resta separato per permettere il parto e la crescita del cervello."],
["L'Islanda non ha zanzare","È uno dei pochissimi posti abitati al mondo dove non esistono. Il ciclo di gelo e disgelo interrompe il loro sviluppo."],
["Il primo brevetto per le patatine","Furono inventate, secondo la leggenda, da un cuoco infastidito da un cliente che voleva le patate più sottili. Voleva punirlo e gli fece un favore."],
["Le nuvole hanno nomi latini dal 1802","Luke Howard, un farmacista dilettante di meteorologia, propose cirrus, cumulus e stratus. Il sistema è ancora in uso oggi."],
["Il ghiaccio del Polo Nord non è terra","L'Artico è oceano coperto di ghiaccio galleggiante; l'Antartide è un continente. Sciogliendosi hanno effetti molto diversi sul livello del mare."],
["Le api ballano per dare indicazioni","La danza dell'addome comunica direzione e distanza rispetto al Sole. Von Frisch prese il Nobel nel 1973 per averla decifrata."],
["Il tuono che rimbomba","Il rombo lungo non è un solo suono ma il fronte d'onda che arriva da punti diversi della scarica, che può essere lunga chilometri."],
["Il primo caffè in Europa","Arrivò a Venezia nel Cinquecento e alcuni volevano vietarlo come bevanda infedele. Secondo la leggenda il papa lo assaggiò e lo approvò."],
["Il sonno degli animali marini","I delfini dormono con metà cervello alla volta e un occhio aperto, altrimenti smetterebbero di risalire a respirare."],
["Il numero di alberi sulla Terra","Le stime parlano di circa tremila miliardi, molto più di quanto si credesse. Sono comunque circa la metà di quelli che c'erano prima dell'agricoltura."],
["Il sapore dell'acqua","L'acqua pura ha un sapore: dipende dai minerali disciolti. Quella distillata sa di niente, e a molti risulta sgradevole proprio per questo."],
["I capelli crescono più veloci d'estate","La circolazione periferica aumenta con il caldo. Anche le unghie crescono un po' più in fretta nei mesi caldi."],
["Il primo giro del mondo","Della spedizione di Magellano partirono cinque navi e circa 270 uomini. Tornò una nave sola con 18 uomini. Magellano non era tra loro."],
["Il colore preferito nel mondo","Nei sondaggi internazionali il blu vince quasi ovunque, in tutte le culture e in entrambi i sessi. Nessuno ha una spiegazione definitiva."],
["Le montagne crescono e si consumano","L'Himalaya si alza di circa un centimetro all'anno per la spinta tettonica, e contemporaneamente viene eroso quasi altrettanto."],
["Il vetro è amorfo","Non è né liquido né cristallo: le molecole sono disordinate come in un liquido ma bloccate come in un solido. È una categoria a sé."],
["I fossili di conchiglie in montagna","Se ne trovano sulle Dolomiti a tremila metri: erano una barriera corallina tropicale duecento milioni di anni fa."]
);

RICETTE.push(
["Cacio e pepe","15 minuti","Difficile solo in apparenza",["Tonnarelli","Pecorino romano","Pepe nero in grani"],"Pesta il pepe nel mortaio e tostalo in padella a secco. Sciogli il pecorino grattugiato con poca acqua di cottura FREDDA in una ciotola, fino a crema. Manteca la pasta fuori dal fuoco, aggiungendo la crema solo quando la padella si è raffreddata.","Se la padella è calda il formaggio filaccia. È l'unico segreto e nessuno lo dice mai."],
["Amatriciana","25 minuti","Facile",["Guanciale","Pomodori pelati","Pecorino","Peperoncino","Bucatini","Vino bianco"],"Guanciale a listarelle in padella fredda, fuoco medio, finché è dorato. Toglilo e tienilo da parte. Sfuma il grasso col vino, aggiungi i pelati schiacciati e il peperoncino, quindici minuti. Rimetti il guanciale solo alla fine, pecorino fuori dal fuoco.","Se rimetti il guanciale nel sugo troppo presto diventa gommoso."],
["Pasta alla Norma","35 minuti","Media",["Melanzane","Pomodorini","Ricotta salata","Basilico","Aglio","Rigatoni"],"Melanzane a cubetti salate mezz'ora e strizzate, poi fritte o al forno finché sono dorate. Sugo veloce con aglio e pomodorini, quindici minuti. Unisci le melanzane all'ultimo, basilico, e ricotta salata grattugiata generosa sopra.","Le melanzane non salate assorbono il triplo dell'olio. La mezz'ora di attesa serve davvero."],
["Risotto ai funghi","30 minuti","Media",["Riso Carnaroli","Funghi porcini","Brodo","Burro","Parmigiano","Prezzemolo"],"Funghi saltati a parte con aglio e prezzemolo, tenuti da parte. Tosta il riso, brodo un mestolo alla volta per diciotto minuti. Aggiungi i funghi negli ultimi cinque. Manteca fuori dal fuoco con burro freddo e parmigiano.","Non lavare mai i porcini sotto l'acqua: puliscili con un panno umido, altrimenti diventano spugne."],
["Orecchiette cime di rapa","25 minuti","Facile",["Orecchiette","Cime di rapa","Acciughe","Aglio","Peperoncino","Pangrattato"],"Cuoci le cime di rapa nella stessa acqua della pasta, buttandole cinque minuti prima. Nel frattempo sciogli le acciughe in olio con aglio e peperoncino. Salta tutto insieme, pangrattato tostato sopra per il croccante.","Il pangrattato tostato è il parmigiano dei poveri e in questo piatto è meglio del parmigiano."],
["Pasta alla puttanesca","20 minuti","Facile",["Spaghetti","Pomodorini","Olive nere","Capperi","Acciughe","Aglio","Peperoncino"],"Aglio e peperoncino in olio, acciughe sciolte, poi olive, capperi dissalati e pomodorini. Quindici minuti a fuoco vivo. Non serve sale: acciughe, olive e capperi bastano e avanzano.","Assaggia prima di salare. Praticamente sempre non serve."],
["Gnocchi di patate","1 ora e mezza","Richiede pratica",["Patate a pasta bianca","Farina","Un uovo","Sale","Noce moscata"],"Patate lesse con la buccia, sbucciate da calde e schiacciate. Aggiungi farina poco per volta finché l'impasto sta insieme: meno farina metti, più sono buoni. Rotolini, taglio, e via in acqua bollente: sono pronti quando risalgono.","Le patate lessate sbucciate assorbono acqua e ti costringono ad aggiungere farina. Con la buccia, sempre."],
["Vitello tonnato","1 ora più riposo","Media",["Girello di vitello","Tonno sott'olio","Capperi","Acciughe","Maionese","Limone"],"Cuoci il vitello in poca acqua con sedano carota cipolla, quaranta minuti, e fallo raffreddare nel suo brodo. Frulla tonno, capperi, acciughe e maionese con qualche cucchiaio di brodo. Affetta sottilissimo da freddo.","Affettarlo da caldo è impossibile. Deve stare in frigo almeno tre ore, meglio la notte."],
["Caponata siciliana","45 minuti più riposo","Facile ma lunga",["Melanzane","Sedano","Cipolla","Olive verdi","Capperi","Aceto","Zucchero","Pomodoro"],"Ogni ingrediente si cuoce separatamente e si unisce alla fine: è la regola che fa la differenza. Melanzane fritte, sedano sbollentato, cipolla stufata. Poi tutto insieme con pomodoro, olive, capperi, e l'agrodolce di aceto e zucchero a fuoco vivo.","Si mangia a temperatura ambiente il giorno dopo, mai calda appena fatta."],
["Polpette al sugo","1 ora","Facile e appagante",["Carne macinata","Pane raffermo","Latte","Uovo","Parmigiano","Passata","Basilico"],"Il pane raffermo ammollato nel latte e strizzato è quello che le rende morbide. Impasta senza lavorare troppo. Rosola le polpette in padella, poi finiscile nel sugo per quaranta minuti a fuoco basso.","Se le impasti troppo diventano dure. Mescola il minimo indispensabile."],
["Zucchine alla scapece","25 minuti più riposo","Facile",["Zucchine","Aceto di vino bianco","Aglio","Menta","Olio EVO"],"Zucchine a rondelle sottili fritte o grigliate finché sono dorate. Stratificale ancora calde con aglio a lamelle, menta strappata, e un misto di aceto e olio. Almeno due ore prima di mangiarle.","La menta va messa a crudo sulle zucchine calde: il calore la apre e profuma tutto."],
["Peperoni ripieni","1 ora","Facile",["Peperoni","Riso o pane","Tonno o carne","Capperi","Prezzemolo","Parmigiano"],"Taglia i peperoni a metà e svuotali. Ripieno a piacere legato con uovo e parmigiano, non troppo compatto. Forno a 180° per quaranta minuti con un dito d'acqua nella teglia, così non bruciano sotto.","Senza l'acqua nella teglia il fondo si carbonizza prima che il ripieno sia cotto."],
["Frittata di pasta","30 minuti","Facile",["Pasta avanzata","Uova","Parmigiano","Pepe","Olio"],"È il modo migliore di finire la pasta del giorno prima. Uova sbattute con parmigiano e pepe, pasta dentro, tutto in padella antiaderente a fuoco basso con coperchio. Gira con un piatto.","Fuoco basso e pazienza: deve fare la crosta senza bruciare. Dieci minuti per lato."],
["Insalata di riso vera","40 minuti","Facile",["Riso","Tonno","Uova sode","Sottaceti","Pomodorini","Olive","Prosciutto cotto"],"Cuoci il riso, scolalo e raffreddalo subito sotto l'acqua fredda, poi stendilo su un vassoio con un filo d'olio. Aggiungi gli ingredienti solo quando è completamente freddo. Riposo di un'ora in frigo prima di servire.","Il riso condito da caldo diventa colla. Un'ora di freddo è obbligatoria."],
["Baccalà alla vicentina","3 ore","Lunga ma indistruttibile",["Stoccafisso ammollato","Cipolle","Latte","Acciughe","Parmigiano","Olio","Polenta"],"Cipolle stufate a lungo con le acciughe. Stoccafisso infarinato disposto in una casseruola, coperto di cipolle, latte e olio. Tre ore a fuoco bassissimo senza mai mescolare. Si serve con polenta.","Mescolare lo rompe. Se ti viene la tentazione, scuoti la pentola invece."],
["Torta salata verdure","50 minuti","Facilissima",["Pasta brisée","Verdure di stagione","Ricotta","Uova","Parmigiano","Timo"],"Verdure saltate e ben asciutte, mescolate con ricotta, uova e parmigiano. Versa sulla brisée e inforna a 180° per trentacinque minuti. Buona calda, tiepida e fredda, il che la rende perfetta per gli avanzi.","Verdure bagnate uguale fondo molliccio. Falle asciugare bene in padella."],
["Minestrone d'estate","45 minuti","Rilassante",["Zucchine","Fagiolini","Patate","Pomodori","Basilico","Pasta piccola","Parmigiano"],"Tutte le verdure a cubetti nella stessa pentola con acqua a coprire, quaranta minuti a fuoco medio. Schiaccia un po' di patate per dare densità. Pasta negli ultimi otto minuti. Si mangia tiepido, non bollente.","D'estate va mangiato a temperatura ambiente con olio a crudo, come si fa in Liguria."],
["Pollo alla cacciatora","50 minuti","Facile",["Pollo a pezzi","Pomodori pelati","Rosmarino","Aglio","Vino rosso","Olive nere"],"Rosola bene i pezzi di pollo su tutti i lati, dieci minuti. Sfuma col vino rosso, aggiungi pelati, rosmarino e olive. Coperchio, trentacinque minuti a fuoco basso.","Se non rosoli bene all'inizio, il pollo lessa nel sugo e perde tutto il sapore."],
["Bruschette come si deve","10 minuti","Impossibile sbagliare",["Pane casereccio","Pomodori maturi","Aglio","Basilico","Olio EVO","Sale"],"Il pane va tostato bene, quasi bruciacchiato ai bordi. Strofina l'aglio sul pane ancora caldo, così si scioglie. Pomodori a cubetti scolati del liquido in eccesso, olio, sale, basilico all'ultimo.","Pomodori non scolati uguale pane fradicio in trenta secondi."],
["Ratatouille","1 ora","Rilassante",["Melanzane","Zucchine","Peperoni","Cipolla","Pomodori","Timo","Aglio"],"Ogni verdura si cuoce separatamente in padella e si uniscono solo alla fine con il pomodoro. È più lungo ma è la differenza tra una ratatouille e una poltiglia.","Buttare tutto insieme in pentola è il modo più veloce per ottenere un pastone marrone."],
["Tortino di patate","1 ora","Facile e scenografico",["Patate","Burro","Rosmarino","Aglio","Sale grosso","Parmigiano"],"Patate affettate sottilissime con la mandolina, disposte a cerchi concentrici in una teglia imburrata. Burro fuso, rosmarino, aglio e parmigiano tra gli strati. Forno a 200° per quaranta minuti, coperto i primi venti.","Senza mandolina le fette sono irregolari e cuociono male. È l'unico attrezzo che serve davvero."],
["Panna cotta","20 minuti più frigo","Facile",["Panna fresca","Zucchero","Gelatina in fogli","Vaniglia","Frutti di bosco"],"Scalda la panna con zucchero e vaniglia senza farla bollire. Gelatina ammollata in acqua fredda e strizzata, sciolta nella panna calda. Negli stampini, almeno quattro ore in frigo.","Se la panna bolle la gelatina perde forza e non rapprende. Togli dal fuoco appena fuma."],
["Crostata di marmellata","1 ora","Classica",["Farina","Burro freddo","Zucchero","Tuorli","Marmellata","Scorza di limone"],"Frolla lavorata velocemente con burro freddo a cubetti: meno la impasti, più è friabile. Riposo in frigo di trenta minuti obbligatorio. Forno a 180° per trentacinque minuti.","La frolla lavorata a lungo si scalda e diventa dura. Usa la punta delle dita, non il palmo."],
["Ciambellone della domenica","1 ora","A prova di tutto",["Farina","Zucchero","Uova","Olio di semi","Latte","Lievito","Limone"],"Tutto in una ciotola nell'ordine, mescolato con la frusta per tre minuti. Stampo a ciambella imburrato e infarinato. Forno a 170° per quaranta minuti senza mai aprire.","Aprire il forno prima di trentacinque minuti lo fa sgonfiare. Resisti."],
["Tiramisù al pistacchio","30 minuti più frigo","Facile",["Mascarpone","Panna","Crema di pistacchio","Savoiardi","Caffè","Pistacchi tritati"],"Come il tiramisù classico ma con due cucchiai abbondanti di crema di pistacchio nel mascarpone. Pistacchi tritati grossolanamente tra gli strati e sopra al momento di servire.","I pistacchi messi ore prima si ammorbidiscono. All'ultimo, sempre."],
["Sorbetto al limone","15 minuti più freezer","Facile",["Limoni non trattati","Zucchero","Acqua","Un albume"],"Sciroppo di acqua e zucchero raffreddato, succo di limone, e un albume montato incorporato alla fine: è quello che lo rende cremoso senza gelatiera. In freezer, mescolando ogni quaranta minuti per tre volte.","Senza mescolare diventa un blocco di ghiaccio. Le tre mescolate sono il lavoro vero."]
);

VIAGGI.push(
["Ravello","Italia","Maggio o settembre","Cinquecento metri sopra la costiera amalfitana, senza le folle di Positano. Villa Cimbrone ha una terrazza a picco sul mare che Gore Vidal definiva la vista più bella del mondo.","Il concerto all'alba del festival estivo, sul palco sospeso sul vuoto.",[]],
["Procida","Italia","Giugno","La più piccola delle isole del golfo di Napoli, senza traghetti pieni e senza boutique. Case colorate perché i pescatori le riconoscessero dal mare.","Marina Corricella al tramonto, che si raggiunge solo a piedi per delle scale.",[]],
["Bologna","Italia","Ottobre","Quaranta chilometri di portici, un'università dal 1088 e il miglior mangiare per chilometro quadrato d'Italia. In ottobre c'è la nebbia giusta.","Il mercato di mezzo la mattina presto, prima che diventi un aperitivo.",[]],
["Urbino","Italia","Aprile","Una città rinascimentale intatta su due colli, con più studenti che abitanti. Il Palazzo Ducale è il posto dove è stato inventato il concetto stesso di corte ideale.","Lo studiolo del duca, tre metri per tre di intarsi in legno.",[]],
["Bolzano e l'Alpe di Siusi","Italia","Fine giugno","Il più grande altopiano alpino d'Europa, raggiungibile in funivia. Prati fioriti fino all'orizzonte con le Dolomiti dietro.","Salire prima delle nove: dopo, la funivia si riempie.",[]],
["Ostuni","Italia","Maggio","La città bianca sopra gli ulivi secolari della piana. La calce serviva contro la peste ed è rimasta.","Le masserie fortificate nella campagna intorno, molte trasformate in agriturismi.",[]],
["Bosa","Italia","Settembre","Case color pastello lungo un fiume in Sardegna, con un castello sopra. Non è sul mare ma a due chilometri, ed è per questo che è rimasta autentica.","La strada costiera da Bosa ad Alghero: quarantacinque chilometri di curve sul mare.",[]],
["Comacchio e il delta del Po","Italia","Aprile","Canali, ponti e fenicotteri rosa a un'ora da Ferrara. Il delta è una zona umida enorme che quasi nessuno visita.","Il ponte dei Trepponti, all'alba, con la nebbia bassa.",[]],
["Isole Egadi","Italia","Giugno","Favignana per il mare, Marettimo per i sentieri, Levanzo per le grotte con le pitture preistoriche. Tre isole diversissime a mezz'ora l'una dall'altra.","La Grotta del Genovese a Levanzo, con incisioni di diecimila anni fa.",[]],
["Porto","Portogallo","Maggio","Più piccola e più ruvida di Lisbona, con il fiume, i ponti di ferro e le cantine di vino sull'altra riva. Si gira tutta a piedi in salita.","La libreria Lello presto al mattino, e poi il tram 1 lungo il fiume.",[]],
["Siviglia","Spagna","Marzo","In estate ci sono quarantacinque gradi. In marzo gli aranci sono in fiore e la città profuma di zagara per tre settimane.","L'Alcázar all'apertura, prima dei gruppi.",[]],
["San Sebastián","Spagna","Settembre","La più alta densità di stelle Michelin d'Europa, ma il meglio sono i pintxos al bancone. La spiaggia della Concha è in mezzo alla città.","Il giro dei bar della Parte Vieja: un pintxo per locale e via.",[]],
["Bruges","Belgio","Novembre","Fuori stagione, con la nebbia sui canali, è tutt'altra città rispetto alle cartoline estive. Il centro medievale è intatto perché la città si impoverì e nessuno costruì più niente.","Salire sul campanile: 366 gradini e nessun ascensore.",[]],
["Ghent","Belgio","Aprile","Come Bruges ma viva: è una città universitaria, quindi non è un museo. Il polittico dell'Agnello Mistico dei Van Eyck è qui.","Il quartiere Patershol per mangiare, la sera.",[]],
["Amsterdam nord","Paesi Bassi","Maggio","Dall'altra parte dell'IJ, dieci minuti di traghetto gratuito e nessun turista. Ex cantieri industriali diventati studi, ristoranti e spiagge urbane.","Il traghetto al tramonto: gratis e con la vista migliore della città.",[]],
["Copenaghen","Danimarca","Giugno","Le giornate durano fino a mezzanotte e la città vive in bicicletta e in acqua. Si può nuotare nel porto, che è balneabile dal 2002.","I bagni di Islands Brygge, in centro, gratis.",[]],
["Stoccolma e l'arcipelago","Svezia","Luglio","Trentamila isole a un'ora di battello dal centro. Molte hanno una casa, un pontile e nient'altro.","L'isola di Grinda: battello, sentiero, bagno, ritorno la sera.",[]],
["Tallinn","Estonia","Giugno","Città medievale intatta e allo stesso tempo la capitale più digitale d'Europa. Il contrasto è tutto il suo fascino.","Il quartiere di Kalamaja, di case di legno colorate.",[]],
["Cracovia","Polonia","Settembre","La piazza medievale più grande d'Europa e un quartiere ebraico, Kazimierz, che è tornato a vivere. Non fu bombardata, quindi è tutto originale.","La miniera di sale di Wieliczka, con cappelle intere scavate nel salgemma.",[]],
["Lubiana","Slovenia","Maggio","Una capitale da trecentomila abitanti che si gira a piedi in un'ora, con un fiume, un castello e i palazzi di Plečnik.","Il lago di Bled è a mezz'ora, ma quello di Bohinj è più bello e vuoto.",[]],
["Mostar e l'Erzegovina","Bosnia","Maggio","Il ponte ricostruito dopo la guerra, e intorno una regione di fiumi verdissimi e nessuna folla.","Le cascate di Kravice, un'ora a sud, dove ci si fa il bagno.",[]],
["Kotor","Montenegro","Settembre","Un fiordo mediterraneo con una città veneziana in fondo. Salire le mura fino alla fortezza costa un'ora e mezza di gradini e vale tutto.","Perast e l'isolotto della Madonna dello Scalpello, in barca.",[]],
["Meteora","Grecia","Ottobre","Monasteri costruiti in cima a colonne di roccia, raggiungibili un tempo solo con reti e argani. Sei sono ancora abitati.","Il tramonto dal punto panoramico sopra Kastraki, non dal monastero.",[]],
["Naxos","Grecia","Settembre","La più grande delle Cicladi, con montagne, villaggi di montagna e agricoltura vera. Non vive solo di turismo, e si sente.","Il villaggio di Apiranthos, tutto in marmo, a settecento metri.",[]],
["Istanbul","Turchia","Aprile","Due continenti, quindici milioni di persone e un traghetto ogni dieci minuti che li collega. L'attraversata del Bosforo al tramonto costa come un biglietto dell'autobus.","La moschea di Süleymaniye invece della Blu: più bella e quasi vuota.",[]],
["Petra e il Wadi Rum","Giordania","Marzo","Petra al mattino presto attraverso il Siq, e poi il deserto di roccia rossa dove hanno girato mezzi film di fantascienza.","Il Monastero, ottocento gradini sopra Petra: quasi nessuno arriva fin lassù.",[]],
["Il Cairo e Luxor","Egitto","Novembre","Le piramidi le conosci. Luxor, con la Valle dei Re e i templi di Karnak, è quella che ti resta addosso.","La riva ovest in bicicletta all'alba, prima del caldo.",[]],
["Zanzibar, Stone Town","Tanzania","Luglio","Un labirinto di vicoli swahili, porte intagliate e mercato del pesce. Il mare bianco è dopo, sull'altro lato dell'isola.","Il mercato di Forodhani la sera, sul lungomare.",[]],
["Città del Capo","Sudafrica","Novembre","Montagna, oceano e vigneti nel raggio di un'ora. La Table Mountain si sale a piedi o in funivia, ed è la differenza tra tre ore e cinque minuti.","Il Cape Point e la strada di Chapman's Peak.",[]],
["Kyoto in inverno","Giappone","Gennaio","Senza folle, con i giardini secchi coperti di brina e i templi quasi vuoti. Il freddo secco rende tutto più nitido.","Il Ryoan-ji sotto la neve, se sei fortunata.",[]],
["Osaka","Giappone","Novembre","La città del mangiare, molto meno formale di Tokyo e Kyoto. Si mangia in piedi, per strada, fino a notte.","Il quartiere di Shinsekai, che sembra fermo agli anni Cinquanta.",[]],
["Seoul","Corea del Sud","Ottobre","Palazzi del Cinquecento a due fermate di metro da quartieri di vetro. Il fiume Han ha parchi lunghi chilometri.","Il villaggio di Bukchon Hanok, di case tradizionali, al mattino presto.",[]],
["Hanoi e la baia di Halong","Vietnam","Novembre","Il centro vecchio di Hanoi è caos organizzato, la baia è duemila isolotti calcarei nel mare.","La zona di Lan Ha invece di Halong: stessa baia, un decimo delle barche.",[]],
["Chiang Mai","Thailandia","Dicembre","Il nord della Thailandia, con le montagne, i templi e un clima molto più sopportabile del sud.","Il mercato della domenica sera lungo Ratchadamnoen.",[]],
["Kerala","India","Gennaio","Le backwaters in barca, il tè sulle colline di Munnar e una cucina completamente diversa da quella del nord.","Una notte a bordo di una houseboat sulle backwaters.",[]],
["Uzbekistan, Samarcanda","Uzbekistan","Aprile","Le cupole azzurre della Via della Seta, restaurate e vuote di turisti. Il Registan è una delle piazze più belle del mondo.","La necropoli di Shah-i-Zinda, al mattino presto, con la luce radente.",[]],
["Georgia, Tbilisi e Kazbegi","Georgia","Maggio","Una capitale sulfurea e caotica, e a tre ore le montagne del Caucaso con la chiesa di Gergeti sotto un ghiacciaio.","I bagni termali di Abanotubani nel centro di Tbilisi.",[]],
["Islanda, altopiani","Islanda","Luglio","L'interno dell'isola è aperto solo due mesi l'anno e richiede fuoristrada. Landmannalaugar ha montagne di riolite colorate.","Il sentiero Laugavegur, cinquantacinque chilometri in quattro giorni.",[]],
["Azzorre, São Miguel","Portogallo","Giugno","Crateri con laghi verdi e blu, sorgenti termali nel bosco e balene al largo. Nell'Atlantico, a due ore da Lisbona.","La pozza termale di Poça da Dona Beija, di sera.",[]],
["Madeira","Portogallo","Aprile","Isola verticale con sentieri lungo i canali d'irrigazione, le levadas, che attraversano foreste primordiali.","La levada do Caldeirão Verde, sei ore andata e ritorno tra le felci.",[]],
["Terranova","Canada","Luglio","Iceberg che passano davanti alla costa, pulcinelle di mare e villaggi di pescatori. Il posto più a est del Nord America.","La costa di Bonavista, dove gli iceberg si vedono da terra.",[]],
["Québec City","Canada","Ottobre","L'unica città murata del Nord America, francofona e con il foliage intorno che in ottobre è irreale.","L'isola di Orléans, a mezz'ora, con i frutteti.",[]],
["Oaxaca","Messico","Novembre","Mercati, mezcal e sette varietà di mole. Il centro coloniale è patrimonio Unesco e le rovine di Monte Albán sono sopra la città.","Il mercato di Tlacolula la domenica: è ancora un mercato vero, non turistico.",[]],
["Valparaíso","Cile","Novembre","Case colorate su quarantadue colline collegate da ascensori a fune di fine Ottocento. Neruda ci aveva una delle sue case.","L'ascensore Reina Victoria e poi il giro dei murales del Cerro Alegre.",[]],
["Patagonia, Torres del Paine","Cile","Dicembre","Il vento è costante e fortissimo. Il circuito W si fa in quattro giorni e le torri all'alba diventano rosse per venti minuti.","Alzarsi alle tre per essere al mirador all'alba: è l'unico modo di vederle rosse.",[]],
["Salta e il nord argentino","Argentina","Aprile","Montagne colorate a strati, cactus giganti e vigneti a duemila metri. Il treno delle nuvole se funziona, l'auto se no.","La Quebrada de Humahuaca e il Cerro de los Siete Colores.",[]],
["Uruguay, Colonia del Sacramento","Uruguay","Marzo","Un'ora di traghetto da Buenos Aires e trecento anni indietro. Strade di ciottoli portoghesi e nessuna fretta.","Il tramonto dal molo vecchio, con Buenos Aires all'orizzonte.",[]],
["Nuova Zelanda, isola del sud","Nuova Zelanda","Febbraio","Fiordi, ghiacciai e strade vuote. È l'estate australe, quindi il nostro inverno.","Il Milford Sound all'alba o sotto la pioggia: con la pioggia si formano centinaia di cascate.",[]],
["Tasmania","Australia","Gennaio","Foreste temperate antichissime, coste bianche e nessuna folla. È la parte d'Australia che gli australiani si tengono per sé.","La Wineglass Bay, un'ora di cammino e una spiaggia perfetta.",[]],
["Kyushu, Beppu e Yufuin","Giappone","Novembre","La regione delle sorgenti termali giapponesi, con l'acqua che esce fumante in mezzo alla città.","Un ryokan con onsen privato: costa e vale.",[]],
["Bergen e i fiordi","Norvegia","Giugno","La città più piovosa d'Europa, e i fiordi più profondi. Il treno per Flåm scende ottocento metri in venti chilometri.","Il Nærøyfjord in barca: è il più stretto e il più impressionante.",[]],
["Scozia, isola di Skye","Scozia","Maggio","Scogliere, pinnacoli di roccia e un tempo che cambia sei volte al giorno. In maggio non ci sono ancora i moscerini.","Il Quiraing all'alba, con la nebbia che si alza dalle valli.",[]],
["Irlanda, Connemara","Irlanda","Settembre","Torbiere, muretti a secco e l'Atlantico. È la parte d'Irlanda dove si parla ancora gaelico.","La Sky Road vicino a Clifden, dodici chilometri sul mare.",[]],
["Cornovaglia","Inghilterra","Giugno","Villaggi di pescatori, spiagge atlantiche e giardini subtropicali grazie alla corrente del Golfo.","St Michael's Mount, raggiungibile a piedi con la bassa marea.",[]],
["Alsazia","Francia","Dicembre","Villaggi a graticcio, vino bianco e i mercatini di Natale meno turistici di quelli tedeschi.","Il villaggio di Riquewihr fuori dagli orari di punta.",[]],
["Corsica","Francia","Settembre","Montagne che cadono nel mare e il GR20, il sentiero più duro d'Europa, per chi vuole. Per gli altri, calette raggiungibili solo in barca.","Le calanche di Piana, al tramonto, quando la roccia diventa rossa.",[]],
["Baviera e le Alpi","Germania","Settembre","Laghi verdi, birra e montagne. In settembre c'è l'Oktoberfest ma anche l'alternativa: le valli vuote.","Il lago di Eibsee sotto lo Zugspitze, giro a piedi di due ore.",[]],
["Slovenia, valle dell'Isonzo","Slovenia","Giugno","Un fiume di un colore turchese che sembra finto, e una storia pesante di Grande Guerra sulle montagne intorno.","Il museo di Caporetto e poi le gole di Tolmin.",[]]

CANZONI.push(
["Hallelujah","Leonard Cohen","Ci mise cinque anni e scrisse ottanta strofe. La versione di Jeff Buckley è quella che ha reso famosa la canzone."],
["Both Sides Now","Joni Mitchell","La versione del 2000, cantata trent'anni dopo l'originale con la voce cambiata, è tutto un altro pezzo."],
["Cavalleria rusticana, Intermezzo","Pietro Mascagni","Tre minuti che Scorsese ha usato per aprire e chiudere Toro Scatenato."],
["Moon River","Audrey Hepburn","Volevano tagliarla dal film. Henry Mancini disse che l'avrebbero fatto sul suo cadavere."],
["What a Wonderful World","Louis Armstrong","Registrata quando aveva sessantasei anni. Negli Stati Uniti fu un fiasco, in Inghilterra fu numero uno."],
["Il pescatore","Fabrizio De André","Scritta in mezz'ora, dice la leggenda. È la storia di un vecchio che dà pane e vino a un assassino, e non chiede niente."],
["Via del Campo","Fabrizio De André","Una via vera di Genova. La melodia gli fu regalata da un chitarrista di strada."],
["Amore che vieni, amore che vai","Fabrizio De André","Sull'amore che finisce senza colpe. Due minuti e mezzo e nessuna parola di troppo."],
["Il cielo in una stanza","Mina","Scritta da Gino Paoli, resa immortale da Mina. Due versioni completamente diverse dello stesso pezzo."],
["E se domani","Mina","Da mettere alta. La progressione dell'ultima strofa è una delle cose più drammatiche della canzone italiana."],
["Emozioni","Lucio Battisti","Il testo è di Mogol, ed è una lista di cose. Funziona proprio perché non spiega niente."],
["Anna","Lucio Battisti","L'urlo finale è entrato nella storia. Battisti la registrò in presa diretta."],
["Impressioni di settembre","PFM","Il moog all'inizio nel 1972 era fantascienza in Italia. Il testo è di Mogol."],
["La canzone di Marinella","Fabrizio De André","Nasce da un fatto di cronaca vero, una prostituta uccisa. De André lo trasformò in una favola per addolcirlo."],
["Nel blu dipinto di blu","Domenico Modugno","La canzone italiana più conosciuta al mondo. Nel 1958 rivoluzionò il modo di stare sul palco a Sanremo."],
["Almeno tu nell'universo","Mia Martini","Scritta nel 1972, incisa nel 1989. Arrivò nona a Sanremo e vinse il premio della critica, che oggi porta il suo nome."],
["Minuetto","Mia Martini","La sua interpretazione più feroce. Il testo di Califano è più duro di quanto la melodia lasci intendere."],
["La donna cannone","Francesco De Gregori","Una donna che vola via. Una delle poche canzoni italiane che si può definire perfetta senza esagerare."],
["Rimmel","Francesco De Gregori","Il disco intero del 1975 vale l'ascolto. Il testo è quasi incomprensibile e funziona lo stesso."],
["Una città per cantare","Ron","Cover italiana di The Road di Danny O'Keefe. A volte le cover superano gli originali."],
["Vita spericolata","Vasco Rossi","Arrivò ultima a Sanremo nel 1983. Quarant'anni dopo è ancora nelle radio."],
["Piazza Grande","Lucio Dalla","Bologna e un uomo che dorme su una panchina. Non è una canzone allegra, e quasi tutti la cantano come se lo fosse."],
["4 marzo 1943","Lucio Dalla","Il titolo originale era il suo compleanno e fu censurato. La canzone è la storia di sua madre, trasfigurata."],
["Attenti al lupo","Lucio Dalla","Sembra una filastrocca e parla di una coppia che si accontenta. Dalla era bravissimo in questo doppio livello."],
["Bocca di rosa","Fabrizio De André","La canzone più cantata nei cori da osteria d'Italia, e allo stesso tempo un attacco frontale al perbenismo."],
["Un giorno credi","Edoardo Bennato","Il ritornello è di quelli che si imparano una volta e restano per sempre."],
["Generale","Francesco De Gregori","Una canzone contro la guerra che non nomina mai una guerra precisa."],
["Ho difeso il mio amore","Nomadi","Sopra la melodia di un movimento di Procol Harum, che a sua volta veniva da Bach."],
["Io vagabondo","Nomadi","Il pezzo che chiude ogni festa italiana da cinquant'anni."],
["Azzurro","Adriano Celentano","Scritta da Paolo Conte. È diventata l'inno non ufficiale delle estati italiane."],
["Via con me","Paolo Conte","'It's wonderful' è la frase più elegante mai infilata in una canzone italiana."],
["Sotto le stelle del jazz","Paolo Conte","Sull'idea che la musica sia una cosa che si fa di notte quando gli altri dormono."],
["Bartali","Paolo Conte","La canzone che ha reso il ciclismo poetico. Naso triste come una salita."],
["Non mi lasciare","Ornella Vanoni","La versione italiana di Ne me quitte pas di Brel. Regge il confronto, cosa rarissima."],
["Senza fine","Gino Paoli","Usata da Paolo Sorrentino e prima ancora nella Caduta delle aquile. Il giro armonico non si chiude mai, da cui il titolo."],
["Ti regalerò una rosa","Simone Cristicchi","Vinse Sanremo nel 2007. Raccontata dalla voce di un paziente di un manicomio, presa da lettere vere."],
["Caruso","Lucio Dalla","Già presente ma va detto: la scrisse a Sorrento, nella stanza dove morì Caruso, in una notte."],
["Fiume Sand Creek","Fabrizio De André","Il massacro dei Cheyenne raccontato dalla voce di un bambino morto. Nessuna parola sopra le righe."],
["Il vecchio e il bambino","Francesco Guccini","Sul futuro raccontato da chi ha visto il passato. Del 1972 e sempre più attuale."],
["Auschwitz","Francesco Guccini","Scritta a ventidue anni. Tre strofe, nessun aggettivo, e non serve altro."],
["Amerigo","Francesco Guccini","Su suo prozio emigrato in America. La canzone italiana più bella sull'emigrazione."],
["Samarcanda","Roberto Vecchioni","Un apologo antico sulla morte che si può fuggire. Il ritornello lo conoscono anche quelli che non sanno di conoscerlo."],
["Luci a San Siro","Roberto Vecchioni","Milano di notte nel 1971. Vecchioni la scrisse quando era ancora un professore di liceo."],
["Chocabeck","Zucchero","Il pezzo più intimo di uno che di solito grida. Sulla fame e sull'infanzia contadina."],
["Bella","Jovanotti","Il momento in cui è diventato un cantautore vero. La produzione regge ancora."],
["Il mio canto libero","Lucio Battisti","Un coro di ragazzi in studio e Battisti che canta sopra. Semplicissima e insuperata."],
["La cura","Franco Battiato","Già presente, ma si può ascoltare due volte l'anno senza consumarla."],
["Centro di gravità permanente","Franco Battiato","Un testo apparentemente senza senso che nessuno ha mai smesso di cantare."],
["Prospettiva Nevski","Franco Battiato","Il pezzo più letterario di Battiato. Nomina Nijinsky e la Russia senza mai spiegare niente."],
["Summertime","George Gershwin","Esistono più di venticinquemila versioni registrate. Quella di Ella Fitzgerald e Louis Armstrong è il punto di partenza."],
["My Funny Valentine","Chet Baker","Baker cantava come uno che non sapeva cantare, ed è esattamente per questo che funziona."],
["So What","Miles Davis","Il primo pezzo di Kind of Blue. Due accordi in tutto il brano e nove minuti che non annoiano mai."],
["Take Five","Dave Brubeck","In cinque quarti, cosa che nel 1959 era considerata commercialmente suicida. Vendette un milione di copie."],
["Round Midnight","Thelonious Monk","Il pezzo jazz più registrato da altri musicisti. Monk lo scrisse a diciannove anni."],
["Body and Soul","Coleman Hawkins","Del 1939. Hawkins improvvisa quasi tutto il brano e per questo cambiò la storia del sassofono."],
["A Love Supreme","John Coltrane","Quattro movimenti, trentatré minuti. Coltrane lo scrisse come un ringraziamento religioso."],
["Naima","John Coltrane","Dedicato alla moglie. Il pezzo più dolce che abbia mai scritto, e dura solo quattro minuti."],
["Blue in Green","Bill Evans","La paternità è contesa tra Evans e Miles Davis. Cinque minuti che sembrano nebbia."],
["Waltz for Debby","Bill Evans","Scritto per la nipote di due anni. Registrato dal vivo al Village Vanguard con il pubblico che chiacchiera."],
["Georgia on My Mind","Ray Charles","Divenne l'inno ufficiale dello stato della Georgia, lo stesso che gli aveva vietato di suonare per anni."],
["Nina Cried Power","Hozier feat. Mavis Staples","Un elenco di cantanti che hanno cambiato le cose. Serve a ricordarsi che la musica ha fatto anche questo."],
["Redemption Song","Bob Marley","Solo voce e chitarra acustica. Registrata quando sapeva già di essere malato."],
["Three Little Birds","Bob Marley","La canzone più semplice del mondo e la più efficace nei giorni storti."],
["Ain't No Sunshine","Bill Withers","Il 'I know' ripetuto ventisei volte era un segnaposto: doveva scrivere un testo lì. Gli dissero di lasciarlo così."],
["Lean on Me","Bill Withers","Withers lavorava in fabbrica quando la scrisse. Continuò a lavorarci anche dopo il successo."],
["Stand by Me","Ben E. King","Il giro di basso è tra i più riconoscibili della storia. Nasce da uno spiritual dell'Ottocento."],

["The Sound of Silence","Simon & Garfunkel","Il primo disco fu un fiasco. Un produttore ci aggiunse la batteria di nascosto e diventò numero uno."],
["Wish You Were Here","Pink Floyd","Su Syd Barrett, il fondatore che se n'era andato. Si dice che si presentò in studio proprio quel giorno, irriconoscibile."],
["Shine On You Crazy Diamond","Pink Floyd","Ventisei minuti nella versione integrale. Le prime quattro note sono un saluto a Barrett."],
["Comfortably Numb","Pink Floyd","Due assoli di chitarra, il secondo è quello che tutti ricordano. Gilmour ne registrò cinque versioni e ne cucì i pezzi migliori."],
["Nights in White Satin","Moody Blues","Scritta a diciannove anni. Il titolo si riferisce a delle lenzuola di raso ricevute in regalo."],
["Perfect Day","Lou Reed","Sembra una giornata romantica e probabilmente parla di droga. Reed non ha mai chiarito."],
["Life on Mars?","David Bowie","Nata come risposta a My Way, che Bowie aveva provato a tradurre senza successo."],
["Heroes","David Bowie","Scritta a Berlino guardando due amanti che si incontravano vicino al Muro."],
["Ashes to Ashes","David Bowie","Il seguito di Space Oddity, dieci anni dopo, e molto più cupo."],
["Fast Car","Tracy Chapman","Tre accordi e una storia intera. Del 1988 e non è invecchiata di un giorno."],
["Talkin' bout a Revolution","Tracy Chapman","Due minuti e mezzo. Il tipo di canzone che si canta camminando."],
["Everybody Hurts","R.E.M.","Scritta apposta per essere semplice, perché i ragazzi la capissero. Stipe fu esplicito su questo."],
["Nightswimming","R.E.M.","Pianoforte e oboe. Una delle poche canzoni rock che parla di nostalgia senza essere patetica."],
["The Blower's Daughter","Damien Rice","Diventata famosa con il film Closer. Il crescendo finale è quasi insopportabile."],
["Skinny Love","Bon Iver","Registrata da solo in una baita del Wisconsin durante un inverno. Si sente."],
["Holocene","Bon Iver","Il video girato in Islanda vale l'ascolto tanto quanto la canzone."],
["Videotape","Radiohead","L'ultima traccia di In Rainbows. Sembra semplice e ha un ritmo sfasato che nessuno nota al primo ascolto."],
["No Surprises","Radiohead","Il carillon più triste della storia del rock. Yorke la registrò in una sola take."]

APRI_QUANDO.push(
["🎂","Quando è il tuo compleanno","Prenditi cinque minuti da sola prima che comincino le telefonate. Fai il conto non degli anni ma delle cose che sai fare adesso e non sapevi fare l'anno scorso. Sono sempre più di quante ne diresti a occhio."],
["😬","Quando hai un colloquio o una prova","Ricordati che chi ti sta davanti spera che tu sia brava, non il contrario: gli semplifichi la vita. E qualunque cosa succeda, fra un mese sarà un aneddoto."],
["🌊","Quando hai bisogno di prospettiva","Cerca su una mappa il punto in cui sei adesso e allarga finché non vedi il continente. Non risolve niente ma ridimensiona tutto, e a volte è la stessa cosa."],
["🎁","Quando qualcuno ti ha delusa","Le persone ti deludono quasi sempre per limiti loro, non per cattiveria verso di te. Non è un'assoluzione: è solo che fa meno male e di solito è vero."],
["🍀","Quando devi decidere in fretta","Scegli l'opzione che ti lascia più opzioni dopo. Nove volte su dieci è quella giusta e non richiede di sapere il futuro."],
["🛏️","Quando non hai voglia di alzarti","Contrattare va bene: alzati e fai una sola cosa, poi puoi tornare a letto se vuoi. Nella maggior parte dei casi non ci tornerai, e se ci torni va bene lo stesso."],
["📞","Quando devi dare una brutta notizia","Dilla all'inizio, chiara, senza preamboli. Il preambolo non protegge nessuno: allunga solo l'attesa di chi ascolta."],
["🎈","Quando ti senti in colpa per aver detto di no","Ogni sì che dai controvoglia toglie qualcosa a un sì che avresti dato volentieri. Non stai togliendo agli altri: stai scegliendo a chi dare."],
["🌡️","Quando sei malata","Non sei indietro, sei ferma. Sono due cose diverse e solo una richiede di recuperare. Il corpo ha una lista di priorità e in questo momento sta seguendo quella giusta."],
["🎧","Quando ti serve staccare subito","Metti le cuffie, scegli un disco che conosci a memoria e fai una cosa manuale: piegare, lavare, sistemare. Il cervello ha bisogno di un compito facile per smettere di girare a vuoto."],
["🕊️","Quando hai perso qualcuno","Non c'è niente da fare bene o male. Il dolore non ha un metodo. L'unica cosa vera è che le persone continuano a esistere nelle cose che ti hanno insegnato, e quelle non si perdono."],
["🌻","Quando è una bella giornata e non te ne accorgi","Fermati adesso e guarda fuori per trenta secondi. Le giornate belle passano più in fretta delle altre proprio perché non le registriamo."],
["🧭","Quando ti senti persa","Non serve sapere dove vai. Serve sapere cosa non vuoi più, e quella lista di solito ce l'hai già chiarissima."],
["💼","Quando il lavoro ti sta mangiando","Il lavoro non restituisce mai il tempo che gli dai in più: lo assorbe e chiede il resto. L'unica cosa che funziona è mettere un confine e difenderlo per due settimane."],
["🎬","Quando hai una serata vuota e non sai cosa fare","Non riempirla. Le serate vuote sono la cosa che a febbraio rimpiangi di non aver avuto. Mettiti comoda e vedi cosa succede."],
["🌍","Quando ti prende voglia di partire","Guardala bene, quella voglia: a volte è del posto, a volte è di lasciare questo. Sono due desideri diversi e vanno soddisfatti in modi diversi."],
["🪞","Quando ti guardi allo specchio e non ti piaci","Sei l'unica persona che si guarda con quel livello di dettaglio. Tutti gli altri ti vedono in movimento, mentre parli, e ti trovano molto meglio di come ti vedi tu ferma."],
["📚","Quando non riesci a concentrarti","Non è colpa tua: la concentrazione è una cosa che si allena e si perde in fretta. Comincia con dieci minuti veri, senza telefono. Domani quindici."]
);
