RICETTE.push(
["Spaghetti aglio olio e peperoncino","12 minuti","La più facile del mondo",["Spaghetti","Aglio","Peperoncino","Prezzemolo","Olio EVO"],"Aglio a lamelle in olio freddo, fuoco basso, finché diventa biondo e mai scuro. Peperoncino alla fine. Salta la pasta con un mestolo di acqua di cottura e prezzemolo tritato a crudo.","Aglio bruciato uguale piatto amaro. Fuoco basso e olio freddo all'inizio, sempre."],
["Pasta e fagioli","50 minuti","Facile e rilassante",["Fagioli borlotti","Sedano carota cipolla","Pomodoro","Rosmarino","Pasta mista","Cotenna o pancetta"],"Soffritto lento, fagioli, poco pomodoro e acqua a coprire. Quaranta minuti. Frulla un terzo dei fagioli e rimettili dentro per la cremosità. Pasta direttamente nella pentola.","Va mangiata densa, non brodosa, e il giorno dopo è ancora meglio."],
["Pasta al pesto","20 minuti","Facile con un accorgimento",["Basilico genovese","Pinoli","Aglio","Parmigiano","Pecorino","Olio EVO","Trofie","Patate e fagiolini"],"Basilico lavato e asciugato benissimo, mai frullato a lungo perché si ossida. Se usi il frullatore, mettilo in freezer prima. Patate e fagiolini cotti con la pasta. Manteca fuori dal fuoco.","Il pesto non va mai scaldato: si aggiunge alla pasta scolata, mai in padella."],
["Lasagne classiche","2 ore","Progetto della domenica",["Sfoglie","Ragù","Besciamella","Parmigiano","Burro"],"Ragù lungo almeno due ore, besciamella non troppo densa. Strati sottili: pasta, ragù, besciamella, parmigiano. Sei strati. Forno a 180° per quaranta minuti, ultimi dieci senza copertura per la crosta.","Riposo di quindici minuti prima di tagliarle, altrimenti si sfaldano nel piatto."],
["Risotto alla milanese","25 minuti","Media",["Riso Carnaroli","Zafferano","Midollo o burro","Cipolla","Brodo di carne","Parmigiano"],"Cipolla tritata finissima e stufata nel burro senza colorarla. Tosta il riso, brodo caldo un mestolo alla volta. Zafferano sciolto in poco brodo negli ultimi cinque minuti. Manteca energicamente.","Lo zafferano messo all'inizio perde profumo. Sempre alla fine."],
["Spaghetti alle vongole","25 minuti","Media",["Spaghetti","Vongole veraci","Aglio","Prezzemolo","Vino bianco","Peperoncino"],"Vongole spurgate in acqua salata almeno due ore. Aprile in padella coperta a fuoco vivo, poi filtra l'acqua che rilasciano. Aglio in olio, vongole, acqua filtrata, e finisci la pasta lì dentro.","L'acqua delle vongole va filtrata con un colino a maglie fitte, o mangi sabbia."],
["Pasta al limone","15 minuti","Facilissima",["Spaghetti","Limoni non trattati","Burro o panna","Parmigiano","Pepe","Basilico"],"Scorza grattugiata e succo di un limone in padella con burro. Manteca la pasta con acqua di cottura e parmigiano. Basilico a crudo.","Il succo va aggiunto fuori dal fuoco, altrimenti diventa amaro."],
["Pasta con broccoli e salsiccia","25 minuti","Facile",["Orecchiette","Broccoli","Salsiccia","Aglio","Peperoncino","Pecorino"],"Broccoli sbollentati nella stessa acqua della pasta, poi ripassati in padella con la salsiccia sbriciolata e rosolata. Salta tutto insieme con un po' di acqua di cottura.","Sbriciola la salsiccia con le mani, non tagliarla: il grasso si scioglie meglio."],
["Pasta ai peperoni","30 minuti","Facile",["Peperoni rossi","Cipolla","Aglio","Basilico","Ricotta salata","Rigatoni"],"Peperoni a listarelle stufati lentamente con la cipolla, venticinque minuti finché diventano una crema. Frulla metà. Salta con la pasta, basilico e ricotta salata.","Il segreto è la cottura lunga e a fuoco basso: i peperoni devono disfarsi."],
["Pasta al tonno","15 minuti","Da dispensa",["Spaghetti","Tonno sott'olio","Pomodorini","Aglio","Capperi","Prezzemolo"],"Aglio in olio, pomodorini schiacciati, dieci minuti. Tonno sgocciolato aggiunto solo alla fine, fuori dal fuoco, per non farlo diventare stopposo. Capperi e prezzemolo.","Il tonno cotto a lungo diventa segatura. Aggiungilo per ultimo, sempre."],
["Carbonara di zucchine","20 minuti","Facile",["Spaghetti","Zucchine","Uova","Pecorino","Pepe","Olio EVO"],"Zucchine a rondelle sottili saltate finché dorate. Tuorli e pecorino in ciotola. Pasta nella padella spenta con le zucchine, poi la crema mescolando con acqua di cottura.","La padella spenta è l'unica regola. Come nella carbonara vera."],
["Melanzane alla parmigiana bianca","1 ora e mezza","Media",["Melanzane","Mozzarella","Parmigiano","Besciamella leggera","Basilico"],"Come la parmigiana classica ma senza pomodoro: strati di melanzane grigliate, besciamella leggera, mozzarella e parmigiano. Più delicata e meno pesante.","Le melanzane grigliate vanno asciugate su carta prima degli strati."],
["Pollo al curry veloce","30 minuti","Facile",["Petto di pollo","Latte di cocco","Curry in pasta o polvere","Cipolla","Zenzero","Riso basmati"],"Cipolla e zenzero, poi il curry tostato trenta secondi nell'olio: è quello che sviluppa l'aroma. Pollo a cubetti, latte di cocco, venti minuti a fuoco medio.","Il curry non tostato sa di polvere. Trenta secondi nell'olio caldo cambiano tutto."],
["Polpettone","1 ora e 15","Facile",["Carne macinata","Pane e latte","Uova","Parmigiano","Prosciutto cotto","Spinaci"],"Impasto steso su carta forno, farcito con prosciutto e spinaci, arrotolato con la carta. Forno a 180° per un'ora, coperto la prima mezz'ora.","Fallo riposare dieci minuti prima di affettare, altrimenti si sbriciola."],
["Frittata di cipolle","25 minuti","Facile",["Cipolle","Uova","Parmigiano","Aceto","Olio EVO","Pepe"],"Cipolle affettate sottili stufate a fuoco bassissimo per quindici minuti finché diventano dolci. Un cucchiaio di aceto alla fine. Falle raffreddare prima di unire le uova.","Le cipolle vanno stufate, non rosolate: se prendono colore diventano amare."],
["Involtini di melanzane","40 minuti","Scenografica",["Melanzane lunghe","Ricotta","Parmigiano","Basilico","Passata","Mozzarella"],"Fette di melanzana grigliate, ripieno di ricotta e parmigiano, arrotolate e messe in una teglia con poca passata sul fondo. Forno a 180° per venti minuti.","Poca passata: devono restare involtini, non affogare."],
["Zuppa di lenticchie","40 minuti","Rilassante",["Lenticchie","Sedano carota cipolla","Pomodoro","Alloro","Pane","Olio EVO"],"Le lenticchie non hanno bisogno di ammollo. Soffritto, lenticchie, un cucchiaio di concentrato, alloro, acqua a coprire. Trentacinque minuti. Sale solo alla fine.","Il sale messo all'inizio indurisce le bucce. Ultimo, sempre."],
["Vellutata di piselli e menta","25 minuti","Facile",["Piselli","Porro","Brodo","Menta","Panna o yogurt","Crostini"],"Porro stufato, piselli, brodo appena a coprire, dieci minuti. Frulla con la menta fresca a fine cottura, non prima, così resta verde e profumata.","La menta cotta a lungo diventa scura e amara."],
["Insalata di polpo e patate","1 ora","Media",["Polpo","Patate","Prezzemolo","Aglio","Limone","Olio EVO","Olive"],"Polpo in acqua bollente non salata, quaranta minuti, e lasciato raffreddare nella sua acqua: è quello che lo rende tenero. Patate lesse a cubetti, condimento semplice.","Se lo scoli subito diventa gommoso. Deve raffreddare nell'acqua di cottura."],
["Branzino al forno con patate","45 minuti","Facile",["Branzino","Patate","Pomodorini","Olive","Rosmarino","Vino bianco"],"Patate a fette sottili sul fondo della teglia con un filo d'olio, quindici minuti in forno da sole. Poi il pesce sopra, pomodorini, olive, vino. Altri venticinque minuti a 190°.","Le patate hanno bisogno di un vantaggio: da sole all'inizio o restano crude."],
["Cozze alla marinara","20 minuti","Facile",["Cozze","Aglio","Prezzemolo","Vino bianco","Pomodorini","Pane"],"Aglio in olio, cozze pulite, coperchio a fuoco vivo. Si aprono in cinque minuti. Sfuma col vino, pomodorini, prezzemolo. Pane abbrustolito obbligatorio.","Le cozze che non si aprono si buttano. Senza discussioni."],
["Torta di ricotta e limone","1 ora","Facile",["Ricotta","Uova","Zucchero","Limoni","Farina o fecola","Vaniglia"],"Ricotta setacciata con zucchero, uova una alla volta, scorza di due limoni, poca fecola. Forno a 160° per cinquanta minuti. Deve restare tremolante al centro.","Cottura bassa e lunga, altrimenti si crepa e diventa asciutta."],
["Biscotti al burro","40 minuti","Con i bambini",["Farina","Burro","Zucchero","Tuorlo","Vaniglia","Sale"],"Burro morbido lavorato con lo zucchero, poi tuorlo e farina. Riposo in frigo di un'ora prima di stendere. Forno a 170° per dodici minuti: devono restare pallidi.","Biscotti dorati uguale biscotti secchi. Togli dal forno quando sembrano ancora crudi ai bordi."],
["Pane senza impasto","24 ore, 10 minuti di lavoro","Sorprendentemente facile",["Farina 0","Acqua","Lievito di birra secco","Sale"],"Mescola farina, acqua, un grammo di lievito e sale. Non impastare. Copri e lascia riposare diciotto ore a temperatura ambiente. Piega due volte e cuoci in pentola di ghisa coperta a 240° per trenta minuti, poi quindici scoperto.","La pentola coperta crea il vapore che fa la crosta. Senza, non funziona."],
["Focaccia genovese","3 ore","Facile ma lunga",["Farina","Acqua","Lievito","Olio EVO","Sale grosso","Malto o zucchero"],"Impasto molto idratato, lievitazione di due ore. Stendi in teglia, fai i buchi con le dita e versa una emulsione di acqua, olio e sale. Forno a 220° per venti minuti.","I buchi con le dita vanno fino in fondo, altrimenti la salamoia non entra."],
["Piadina","30 minuti","Facile",["Farina","Strutto o olio","Acqua","Sale","Bicarbonato"],"Impasto veloce, riposo di trenta minuti, dischi sottili cotti su padella rovente due minuti per lato. Bolle e macchie scure sono giuste, non bruciature.","La padella deve essere già bollente prima di appoggiare la piadina."],
["Crema pasticcera","20 minuti","Base fondamentale",["Latte","Tuorli","Zucchero","Amido","Vaniglia","Scorza di limone"],"Latte in infusione con vaniglia e scorza. Tuorli con zucchero e amido. Versa il latte caldo filtrato sui tuorli mescolando, poi torna sul fuoco fino ad addensare.","Mai versare i tuorli nel latte bollente: si straccia. Sempre il contrario."],
["Semifreddo al caffè","20 minuti più freezer","Facile e d'effetto",["Panna","Zucchero a velo","Caffè espresso freddo","Savoiardi","Cacao"],"Panna montata con lo zucchero a velo, caffè freddo incorporato dal basso. Stampo da plumcake foderato, strati con savoiardi. Sei ore in freezer, dieci minuti fuori prima di servire.","Il caffè deve essere freddo o smonta la panna."],
["Bruschette con fagioli","15 minuti","Da dispensa",["Fagioli cannellini","Aglio","Rosmarino","Pane","Olio EVO","Pepe"],"Fagioli scaldati con aglio e rosmarino, metà schiacciati con la forchetta per la cremosità. Pane tostato, olio a crudo abbondante.","Olio a crudo generoso: è metà del piatto."],
["Hummus","10 minuti","Impossibile sbagliare",["Ceci cotti","Tahina","Limone","Aglio","Cumino","Olio EVO"],"Frulla tutto con qualche cucchiaio di acqua di cottura dei ceci finché diventa liscio. Più lo frulli, più è cremoso. Olio e paprika sopra.","Se togli le pellicine dei ceci diventa vellutato. È noioso e si sente."],
["Tzatziki","10 minuti più riposo","Facile",["Yogurt greco","Cetriolo","Aglio","Aneto o menta","Limone","Olio EVO"],"Cetriolo grattugiato, salato e strizzato benissimo. Mescolato allo yogurt con aglio grattugiato e erbe. Un'ora in frigo.","Il cetriolo non strizzato rilascia acqua e diventa una zuppa."],
["Uova strapazzate come si deve","8 minuti","Tecnica pura",["Uova","Burro","Sale","Pepe","Erba cipollina"],"Fuoco bassissimo, burro, uova sbattute appena. Mescola in continuazione con una spatola, togliendo dal fuoco ogni venti secondi. Sale solo alla fine. Devono restare cremose.","Fuoco alto uguale gomma. Ci vogliono otto minuti veri, non due."],
["Pancake","20 minuti","Con i bambini",["Farina","Latte","Uovo","Zucchero","Lievito","Burro"],"Mescola senza insistere: i grumi vanno bene. Riposo di dieci minuti. Padella calda appena unta. Girali quando la superficie fa le bolle e si aprono.","L'impasto lavorato troppo sviluppa il glutine e li rende gommosi."],
["French toast","15 minuti","Facile",["Pane raffermo","Uova","Latte","Zucchero","Cannella","Burro"],"Fette di pane immerse trenta secondi per lato nel composto di uova e latte. Padella con burro, fuoco medio, tre minuti per lato.","Pane troppo fresco si sfalda. Deve essere di almeno un giorno."],
["Insalata di finocchi e arance","10 minuti","Invernale e perfetta",["Finocchi","Arance","Olive nere","Cipolla rossa","Olio EVO","Pepe"],"Finocchi affettati sottilissimi, arance pelate a vivo con il coltello, olive, cipolla lasciata in acqua fredda dieci minuti. Solo olio, sale e pepe.","Niente aceto né limone: le arance bastano come parte acida."],
["Cavolo nero saltato","20 minuti","Facile",["Cavolo nero","Aglio","Peperoncino","Olio EVO","Pane"],"Cavolo nero sbollentato cinque minuti, strizzato e ripassato in padella con aglio e peperoncino. Su pane tostato è una cena.","Va sbollentato prima, altrimenti resta coriaceo qualunque cosa tu faccia."],
["Patate al forno perfette","1 ora","Facile con un trucco",["Patate","Olio EVO","Rosmarino","Aglio","Sale grosso"],"Patate a spicchi sbollentate cinque minuti, poi scolate e scosse nella pentola per rovinarne la superficie: è quella rugosità che diventa croccante. Forno a 200° per quaranta minuti.","La scossa nella pentola è il segreto. Senza, restano lisce e molli."],
["Ceci all'agrodolce","30 minuti","Facile",["Ceci cotti","Cipolla","Uvetta","Pinoli","Aceto","Zucchero","Alloro"],"Cipolla stufata, ceci, uvetta ammollata, pinoli tostati. Aceto e zucchero alla fine a fuoco vivo per due minuti, così sfuma.","L'aceto va fatto evaporare a fuoco alto, altrimenti resta pungente."],
["Farinata di ceci","1 ora di riposo, 20 di cottura","Facile",["Farina di ceci","Acqua","Olio EVO","Sale","Rosmarino"],"Farina di ceci e acqua sbattute, riposo di almeno un'ora togliendo la schiuma. Teglia unta abbondantemente, strato sottile, forno a 250°.","Lo strato deve essere sottilissimo, mezzo centimetro. Più spesso resta molle."],
["Riso al salto","20 minuti","Per gli avanzi",["Risotto avanzato","Burro","Parmigiano"],"Risotto freddo schiacciato in padella con burro, fuoco medio, dieci minuti senza toccarlo. Gira con un piatto e altri cinque minuti.","Non toccarlo è tutta la ricetta. La crosta si forma da sola."],
["Crema di zucchine","25 minuti","Facile",["Zucchine","Patata","Porro","Brodo","Basilico","Olio EVO"],"Una patata piccola dà la cremosità senza panna. Porro, zucchine, patata, brodo appena a coprire, venti minuti, frulla con basilico a crudo.","Poco brodo: la crema deve essere densa, si allunga sempre."],
["Sformato di verdure","1 ora","Facile",["Verdure lesse","Uova","Parmigiano","Besciamella","Pangrattato","Noce moscata"],"Verdure frullate grossolanamente, unite a uova, parmigiano e poca besciamella. Stampo imburrato e pangrattato. Forno a 180° per quaranta minuti.","Il pangrattato nello stampo serve a poterlo sformare. Non saltarlo."],
["Filetti di pesce al cartoccio","25 minuti","Facilissima",["Filetti di pesce","Pomodorini","Olive","Capperi","Limone","Prezzemolo"],"Ogni filetto in un foglio di carta forno con pomodorini, olive, capperi e un filo d'olio. Chiudi bene. Forno a 200° per quindici minuti.","Il cartoccio deve essere chiuso ermetico o esce tutto il vapore e il pesce si asciuga."],
["Scaloppine al limone","15 minuti","Veloce",["Fettine di vitello","Farina","Burro","Limone","Prezzemolo","Brodo"],"Fettine infarinate e rosolate un minuto per lato. Toglile. Nella padella brodo e succo di limone, fai restringere, rimetti la carne trenta secondi.","La carne va tolta e rimessa alla fine, altrimenti si asciuga nel sugo."],
["Verdure grigliate marinate","30 minuti","Facile",["Zucchine","Melanzane","Peperoni","Aglio","Menta","Aceto","Olio EVO"],"Verdure grigliate una alla volta e stratificate ancora calde con aglio, menta, aceto e olio. Almeno un'ora prima di mangiare.","Da calde assorbono la marinata. Da fredde restano solo condite in superficie."],
["Pesto di pistacchi","10 minuti","Velocissima",["Pistacchi","Parmigiano","Basilico","Aglio","Olio EVO","Acqua di cottura"],"Frulla pistacchi, parmigiano, un po' di basilico e olio. Allunga con acqua di cottura in padella. Ottimo con paccheri.","Va allungato con l'acqua di cottura o resta una pasta densa e stopposa."],
["Zuppa di cipolle","1 ora","Rilassante",["Cipolle","Burro","Brodo","Pane","Gruviera","Vino bianco"],"Cipolle affettate stufate nel burro per quaranta minuti a fuoco basso, finché diventano marroni e dolci. Sfuma col vino, brodo, poi pane e formaggio gratinati sopra.","I quaranta minuti di cipolle sono tutto il piatto. Non si può accorciare."],
["Torta al cioccolato senza farina","45 minuti","Facile e d'effetto",["Cioccolato fondente","Burro","Uova","Zucchero","Sale"],"Cioccolato e burro fusi a bagnomaria. Uova montate con lo zucchero fino a triplicare, poi unite al cioccolato dal basso. Forno a 170° per venticinque minuti.","Deve restare umida al centro. Lo stecchino esce sporco ed è giusto così."],
["Mousse al cioccolato","20 minuti più frigo","Facile",["Cioccolato fondente","Uova","Panna","Zucchero","Sale"],"Cioccolato fuso raffreddato, tuorli, poi albumi montati a neve incorporati in tre volte dal basso verso l'alto. Quattro ore in frigo.","Il cioccolato deve essere tiepido, non caldo, o cuoce i tuorli."],
["Pesche al forno","40 minuti","Estiva",["Pesche","Amaretti","Cacao","Zucchero","Burro","Vino bianco"],"Pesche a metà svuotate leggermente, ripiene di amaretti sbriciolati, cacao e zucchero. Un dito di vino nella teglia. Forno a 180° per trenta minuti.","Devono essere pesche gialle sode, non bianche mature: si sfaldano."],
["Macedonia come si deve","15 minuti","Elementare ma non banale",["Frutta di stagione","Limone","Zucchero","Menta"],"Taglia tutta la frutta della stessa dimensione, poco zucchero, succo di limone, e mezz'ora in frigo prima di servire. La menta a crudo all'ultimo.","Frutta tagliata di misure diverse dà una macedonia sbilanciata a ogni cucchiaio."],
["Crema di ceci e rosmarino su pane","20 minuti","Facile",["Ceci","Rosmarino","Aglio","Olio EVO","Pane","Limone"],"Ceci frullati con aglio, rosmarino, olio e un po' di acqua di cottura. Su pane tostato spesso, con olio a crudo e scorza di limone.","La scorza di limone alla fine sveglia tutto. Non ometterla."],
["Pasta con la zucca","30 minuti","Autunnale",["Zucca","Cipolla","Salvia","Amaretti o noci","Parmigiano","Pasta corta"],"Zucca a cubetti stufata con cipolla e salvia finché si disfa, venti minuti. Metà frullata. Salta con la pasta, parmigiano e noci tostate.","Un amaretto sbriciolato sopra: è il tocco mantovano e sembra strano finché non lo provi."],
["Cous cous di verdure","25 minuti","Facile",["Cous cous","Zucchine","Peperoni","Ceci","Uvetta","Menta","Limone"],"Cous cous idratato con acqua bollente pari peso e un filo d'olio, coperto dieci minuti, poi sgranato con la forchetta. Verdure saltate a parte, unite alla fine.","Il cous cous va sgranato con le mani unte d'olio, non con il cucchiaio."],
["Frittata di erbe","20 minuti","Primaverile",["Uova","Erbe miste","Cipollotto","Parmigiano","Olio EVO"],"Bietole, spinaci, ortiche o quello che trovi: sbollentati, strizzati e tritati. Cipollotto stufato. Tutto nelle uova con parmigiano.","Le erbe vanno strizzate fortissimo o la frittata resta acquosa."],
["Riso freddo con verdure crude","30 minuti","Estiva",["Riso basmati","Pomodorini","Cetriolo","Avocado","Limone","Erbe fresche"],"Riso cotto, raffreddato e condito con olio e limone. Verdure crude tagliate piccole aggiunte solo al momento di servire.","Le verdure crude aggiunte in anticipo rilasciano acqua. All'ultimo."],
["Torta di carote","50 minuti","Facile",["Carote","Mandorle","Uova","Zucchero","Olio di semi","Lievito","Limone"],"Carote e mandorle frullate insieme, uova montate con zucchero, olio a filo. Forno a 170° per quaranta minuti. Umida e senza burro.","Le mandorle frullate finemente sostituiscono metà della farina e la rendono umida."]
);

/* ── RELAX: da 72 a 100 ── */
RELAX.push(
{t:"Yoga",e:"🧘",n:"Il guerriero II",d:"5 minuti",x:"In piedi, gambe larghe, un piede ruotato in fuori, braccia aperte parallele al pavimento, sguardo sulla mano davanti. Trenta secondi per lato, tre volte. È una posizione di forza, non di rilassamento: serve nei giorni in cui ti senti piccola.",c:"virabhadrasana II yoga"},
{t:"Yoga",e:"🧘",n:"L'albero",d:"4 minuti",x:"In piedi su una gamba, l'altro piede appoggiato alla caviglia o all'interno coscia, mai sul ginocchio. Fissa un punto fermo davanti a te: l'equilibrio dipende quasi tutto dallo sguardo.",c:"vrksasana yoga albero"},
{t:"Yoga",e:"🧘",n:"Ponte",d:"5 minuti",x:"Sdraiata sulla schiena, ginocchia piegate, piedi vicini al sedere. Solleva il bacino spingendo con i piedi. Tieni trenta secondi, scendi vertebra per vertebra. Cinque volte.",c:"setu bandhasana yoga"},
{t:"Yoga",e:"🧘",n:"Testa al ginocchio",d:"6 minuti",x:"Seduta, una gamba distesa e l'altra piegata con la pianta all'interno coscia. Scendi verso il piede disteso senza forzare. Tre minuti per lato: è una delle posizioni che più calmano il sistema nervoso.",c:"janu sirsasana yoga"},
{t:"Respiro",e:"🌬️",n:"Il respiro del leone",d:"3 minuti",x:"Inspira dal naso, poi espira dalla bocca spalancata tirando fuori la lingua e facendo rumore. Cinque volte. È ridicolo e libera la tensione della mascella meglio di qualsiasi massaggio.",c:"simhasana respirazione del leone"},
{t:"Respiro",e:"🌬️",n:"Contare all'indietro",d:"5 minuti",x:"Respira normalmente e conta all'indietro da cento, saltando di tre in tre: cento, novantasette, novantaquattro. Occupa esattamente la parte di cervello che sta rimuginando, ed è per questo che funziona per addormentarsi.",c:""},
{t:"Quadro",e:"🖼️",n:"La camera di Van Gogh vista due volte",d:"4 minuti",x:"Ne dipinse tre versioni quasi identiche a distanza di mesi. Cerca due versioni e confronta i colori delle pareti: cambiano da lilla a azzurro. Van Gogh scriveva al fratello che il quadro doveva far riposare la mente.",c:"Camera da letto ad Arles versioni Van Gogh"},
{t:"Quadro",e:"🖼️",n:"Ofelia — Millais",d:"3 minuti",x:"La modella posò per mesi in una vasca da bagno scaldata da candele, che a un certo punto si spensero: si ammalò gravemente. Ogni pianta nel dipinto è botanicamente esatta e ha un significato simbolico.",c:"Ofelia Millais dipinto"},
{t:"Quadro",e:"🖼️",n:"Il figliol prodigo — Rembrandt",d:"4 minuti",x:"Una delle sue ultime opere. Guarda le due mani del padre sulle spalle del figlio: sono diverse una dall'altra, una maschile e una femminile. Non è un errore.",c:"Ritorno del figliol prodigo Rembrandt"},
{t:"Quadro",e:"🖼️",n:"Composizione — Kandinskij",d:"3 minuti",x:"Kandinskij aveva la sinestesia: vedeva i colori quando sentiva la musica. Non cercare cosa rappresenta, ascoltalo. È letteralmente il modo in cui voleva essere guardato.",c:"Kandinsky composizione dipinto"},
{t:"Film",e:"🎬",n:"Il tè nel deserto",d:"138 minuti",x:"Bertolucci nel Sahara con la fotografia di Storaro. Lento, enorme e ipnotico. Da guardare quando hai bisogno di guardare lontano.",c:"Il tè nel deserto Bertolucci"},
{t:"Film",e:"🎬",n:"Il vento fa il suo giro",d:"110 minuti",x:"Un pastore francese si trasferisce in un paese delle valli occitane. Girato con attori non professionisti nella loro lingua. Costò pochissimo e resta addosso per anni.",c:"Il vento fa il suo giro film"},
{t:"Film",e:"🎬",n:"Le quattro volte",d:"88 minuti",x:"Quasi senza dialoghi: un pastore, una capra, un albero, il carbone. La Calabria e il ciclo delle cose. Sembra un documentario e non lo è.",c:"Le quattro volte film Frammartino"},
{t:"Libro",e:"📖",n:"Diario di un viaggio in Italia — Goethe",d:"a capitoli",x:"Goethe in Italia tra il 1786 e il 1788, che guarda tutto con l'entusiasmo di uno che non aveva mai visto il sud. Si legge un pezzo per volta.",c:"Viaggio in Italia Goethe"},
{t:"Libro",e:"📖",n:"L'arte di essere felici — Schopenhauer",d:"90 pagine",x:"Cinquanta regole per vivere, scritte dal filosofo più pessimista dell'Ottocento. È il paradosso che lo rende così divertente e utile.",c:"L'arte di essere felici Schopenhauer"},
{t:"Libro",e:"📖",n:"Lettere a Lucilio — Seneca",d:"una lettera per sera",x:"Sono centoventiquattro lettere brevi su come vivere. Ne leggi una prima di dormire e sembra scritta la settimana scorsa.",c:"Lettere a Lucilio Seneca"},
{t:"Libro",e:"📖",n:"Haiku — Bashō",d:"cinque minuti",x:"Diciassette sillabe per volta. Non c'è modo di leggerli in fretta: la brevità obbliga a rallentare, che è esattamente il punto.",c:"Matsuo Basho haiku"},
{t:"Musica",e:"🎧",n:"Notturni — Chopin",d:"un notturno alla volta",x:"Ne scrisse ventuno. Il numero 2 in mi bemolle è il più famoso, ma il numero 20 in do diesis minore è quello che spacca il cuore.",c:"Chopin Notturni"},
{t:"Musica",e:"🎧",n:"Le quattro stagioni d'inverno — Vivaldi",d:"9 minuti",x:"Il secondo movimento dell'Inverno è il pezzo più caldo mai scritto sul freddo. Vivaldi lo accompagnò con un sonetto che descrive stare accanto al fuoco mentre fuori piove.",c:"Vivaldi Inverno largo"},
{t:"Musica",e:"🎧",n:"Clair de Lune — Debussy",d:"5 minuti",x:"Fa parte della Suite bergamasque, che Debussy ci mise quindici anni a pubblicare perché non era convinto. È diventato il pezzo per pianoforte più conosciuto al mondo.",c:"Debussy Clair de lune"},
{t:"Musica",e:"🎧",n:"An Ending (Ascent) — Brian Eno",d:"4 minuti",x:"Composto per un documentario sull'Apollo. È stato usato in decine di film perché fa esattamente una cosa: allarga lo spazio intorno a chi ascolta.",c:"Brian Eno An Ending Ascent"},
{t:"Rituale",e:"🧦",n:"Cambiarsi appena a casa",d:"5 minuti",x:"Togliere i vestiti con cui sei stata fuori e metterne altri è un segnale fisico che il cervello legge come cambio di modalità. Molte culture lo fanno per abitudine e non a caso.",c:""},
{t:"Rituale",e:"📵",n:"La prima ora senza telefono",d:"60 minuti",x:"Non controllare niente nella prima ora dopo il risveglio. Sembra impossibile e cambia il tono di tutta la mattina: cominci la giornata con i tuoi pensieri invece che con quelli di altri.",c:""},
{t:"Rituale",e:"🍽️",n:"Mangiare senza fare altro",d:"il pasto",x:"Un pasto solo, senza telefono, senza televisione, senza leggere. Il senso di sazietà arriva con circa venti minuti di ritardo, e mangiare distratti lo scavalca del tutto.",c:""},
{t:"Rituale",e:"🚲",d:"30 minuti",n:"Il giro lento in bicicletta",x:"Non per allenarsi: proprio lento, in pianura, senza destinazione. La bicicletta ha una velocità che permette di guardare le cose, che a piedi sono troppo vicine e in macchina troppo lontane.",c:""},
{t:"Rituale",e:"✏️",n:"Disegnare male una cosa",d:"20 minuti",x:"Prendi un oggetto qualsiasi e disegnalo, sapendo che verrà male. Disegnare obbliga a guardare davvero, e dopo venti minuti ti accorgi di dettagli di una tazza che usi da anni.",c:""},
{t:"Rituale",e:"🌙",n:"L'ora della luce bassa",d:"la sera",x:"Un'ora prima di dormire, solo lampade basse e calde. La luce fredda dall'alto dice al corpo che è ancora giorno. Non è una teoria: è la ragione fisiologica per cui non ti addormenti.",c:""},
{t:"Rituale",e:"📖",n:"Leggere venti pagine e basta",d:"25 minuti",x:"Non un capitolo, non un libro: venti pagine. Un obiettivo così piccolo che non puoi non farcela, e nella maggior parte dei casi ne leggerai di più senza accorgertene.",c:""}
);

["Alberobello e la Valle d'Itria","Italia","Maggio","I trulli sono la cartolina, ma la valle intorno con Locorotondo, Cisternino e Martina Franca è la parte vera.","Cisternino la sera: si compra la carne dal macellaio e te la cuoce lui.",[]],

["Isole Tremiti","Italia","Giugno","Cinque isole nell'Adriatico davanti al Gargano, con acqua trasparente e nessuna strada vera. San Domino per il verde, San Nicola per la storia.","Il giro dell'isola in barca con le grotte, due ore.",[]],
["Genova","Italia","Novembre","Non è una città facile ed è per questo che è interessante. I caruggi, il porto antico e i palazzi dei Rolli, che si visitano solo in certi weekend.","Il giro dei Rolli, se capiti nel weekend giusto: palazzi privati aperti al pubblico.",[]],
["Bergamo alta","Italia","Marzo","Una città murata veneziana in cima a un colle, raggiungibile in funicolare. Il centro basso è un'altra città, molto meno interessante.","Le mura al tramonto, con la pianura sotto e le Orobie dietro.",[]],
["Camogli e San Fruttuoso","Italia","Maggio","Case altissime e strette sul mare, e a mezz'ora di barca un'abbazia medievale in una baia raggiungibile solo via mare o a piedi.","San Fruttuoso a piedi da Camogli: due ore di sentiero sul mare.",[]],
["Anversa","Belgio","Settembre","La città del diamante e della moda, con una stazione ferroviaria che è considerata tra le più belle del mondo. Molto meno turistica di Bruxelles.","Il MAS, il museo sul porto, e la terrazza panoramica gratuita in cima.",[]],
["Utrecht","Paesi Bassi","Maggio","Come Amsterdam ma senza le folle, con i canali a due livelli e le cantine sull'acqua trasformate in caffè.","Il Dom, la torre più alta d'Olanda, e i suoi 465 gradini.",[]],
["Friburgo","Germania","Giugno","Al margine della Foresta Nera, con i canaletti d'acqua che corrono lungo le strade del centro. Una delle città più verdi d'Europa.","La salita allo Schlossberg dietro il centro, venti minuti a piedi.",[]],
["Salisburgo","Austria","Dicembre","Mozart, il barocco e i mercatini di Natale nel centro storico. Meglio dicembre che l'estate, quando è ingestibile.","Le miniere di sale di Hallein, a mezz'ora.",[]],
["Innsbruck","Austria","Febbraio","Una città a sei minuti di funicolare dalle piste. Il centro medievale con le montagne che chiudono ogni prospettiva.","La Nordkette: dal centro a duemila metri in venti minuti.",[]],
["Berna","Svizzera","Settembre","Sei chilometri di portici, un fiume verde smeraldo in cui la gente si tuffa d'estate, e la casa di Einstein.","Nuotare nell'Aare con la corrente, come fanno i bernesi.",[]],
["Bolzano e la Val Venosta","Italia","Ottobre","Meleti a perdita d'occhio, una pista ciclabile lunga ottanta chilometri e i castelli. Bilingue in tutto.","La ciclabile da Malles a Merano, tutta in leggera discesa.",[]],
["Le Marche, Conero","Italia","Settembre","Una montagna che cade nell'Adriatico, con spiagge bianche raggiungibili solo a piedi o in barca.","La spiaggia delle Due Sorelle, solo in barca.",[]],
["Vilnius","Lituania","Giugno","Il centro barocco più grande dell'Europa orientale, e un quartiere, Užupis, che si è dichiarato repubblica indipendente per scherzo.","La costituzione di Užupis affissa in quaranta lingue su un muro.",[]],
["Riga","Lettonia","Settembre","La più alta concentrazione di architettura Art Nouveau al mondo. Un intero quartiere di facciate del primo Novecento.","Via Alberta, una strada sola di palazzi in stile.",[]],
["Belgrado","Serbia","Maggio","Una città che ha vissuto troppo, con una fortezza sulla confluenza di due fiumi e una vita notturna sulle chiatte.","La fortezza di Kalemegdan al tramonto, dove Sava e Danubio si incontrano.",[]],
["Timisoara","Romania","Maggio","Piazze asburgiche restaurate e un'aria mitteleuropea che non ti aspetti in Romania. Fu la prima città europea con l'illuminazione elettrica delle strade.","La piazza dell'Unione al tramonto.",[]],
["Ohrid","Macedonia del Nord","Settembre","Un lago tra i più antichi del mondo, con chiese bizantine sulla riva. Acqua trasparente e prezzi bassissimi.","La chiesa di San Giovanni a Kaneo, su uno sperone sul lago.",[]],
["Berat","Albania","Maggio","La città delle mille finestre, con le case ottomane una sopra l'altra sulla collina. Patrimonio Unesco e ancora poco battuta.","Il castello abitato in cima: ci vive ancora gente.",[]]

/* ═════════ CAROSELLO ═════════
   La carta i sta a rotateY(i*PASSO) translateZ(R); il contenitore ruota di `angolo`.
   La carta guarda chi la osserva quando (angolo + i*PASSO) è multiplo di 360:
   il fronte è a 0 gradi, NON a 180. Con la convenzione sbagliata si vede il retro
   e tutte le scritte appaiono specchiate. */
const anello = document.getElementById("anello");
const stage  = document.getElementById("stage");
const etichetta = document.getElementById("etichetta");
const PASSO = 360/SEZIONI.length;
let RAGGIO=460, angolo=0, velocita=0, premuto=false, giuX=0, giuY=0, giuT=0, ultimoX=0;

anello.innerHTML = SEZIONI.map((s,i)=>`
  <button class="carta" data-id="${s.id}" data-i="${i}" style="--c1:${s.c1};--c2:${s.c2};--d:${i*0.04}s">
    <span class="glow"></span><span class="lustro"></span>
    <span class="num">${String(i+1).padStart(2,"0")}</span>
    <span class="emo">${s.emoji}</span>
    <span class="tit">${s.titolo}</span>
    <span class="sot">${s.sotto}</span>
  </button>`).join("");
const carte = [...anello.querySelectorAll(".carta")];

function misura(){
  const w = innerWidth;
  const cw = w<560 ? 130 : w<1000 ? 162 : 186;
  document.documentElement.style.setProperty("--cw", cw+"px");
  document.documentElement.style.setProperty("--ch", Math.round(cw*1.34)+"px");
  RAGGIO = Math.max(w<560?270:w<1000?370:450, SEZIONI.length*(cw+14)/(2*Math.PI));
  carte.forEach((c,i)=> c.style.transform = `rotateY(${i*PASSO}deg) translateZ(${RAGGIO}px)`);
}
addEventListener("resize", misura);
misura();

const norm = a => ((a%360)+360)%360;
function frontale(){
  let b=0, bd=1e9;
  carte.forEach((c,i)=>{ const a=norm(angolo+i*PASSO); const d=Math.min(a,360-a); if(d<bd){bd=d;b=i;} });
  return b;
}
function vaiA(i){ velocita=0; angolo = -i*PASSO; }

function aggiorna(){
  anello.style.transform = `translateZ(${-RAGGIO}px) rotateY(${angolo}deg)`;
  carte.forEach((c,i)=>{
    const a = norm(angolo + i*PASSO);
    const t = (Math.cos(a*Math.PI/180)+1)/2;      // 1 = davanti, 0 = dietro
    c.style.opacity = (0.14+t*0.86).toFixed(3);
    c.style.filter  = t>0.78 ? "none" : `blur(${((0.78-t)*9).toFixed(1)}px)`;
    c.style.zIndex  = Math.round(t*100);
    c.style.pointerEvents = t>0.6 ? "auto" : "none";
  });
  const f = frontale();
  if (etichetta.dataset.i != f){
    etichetta.dataset.i = f;
    etichetta.innerHTML = `<b>${SEZIONI[f].titolo}</b><em>${SEZIONI[f].sotto}</em>`;
  }
}

let ultimoT=0;
(function ciclo(ora){
  const dt = ultimoT ? Math.min((ora-ultimoT)/16.67, 3) : 1;
  ultimoT = ora;
  if (!premuto){
    angolo += velocita*dt;
    velocita *= Math.pow(0.93, dt);
    if (Math.abs(velocita) < 0.4){
      velocita = 0;
      const bersaglio = Math.round(angolo/PASSO)*PASSO;   // aggancio: una carta sempre centrata
      const scarto = bersaglio - angolo;
      if (Math.abs(scarto) > 0.08) angolo += scarto*Math.min(0.16*dt,1); else angolo = bersaglio;
    }
  }
  aggiorna();
  requestAnimationFrame(ciclo);
})(0);

/* ═════════ TRASCINAMENTO E CLIC ═════════ */
const scena = document.getElementById("scena");
scena.addEventListener("pointerdown", e=>{
  premuto=true; giuX=e.clientX; giuY=e.clientY; giuT=Date.now(); ultimoX=e.clientX; velocita=0;
});
addEventListener("pointermove", e=>{
  if(!premuto) return;
  const dx=e.clientX-ultimoX; ultimoX=e.clientX;
  if (Math.abs(e.clientX-giuX)>5){ angolo += dx*0.3; velocita = dx*0.3; }
});
addEventListener("pointerup", e=>{
  if(!premuto) return;
  premuto=false;
  const mosso = Math.abs(e.clientX-giuX)+Math.abs(e.clientY-giuY);
  if (mosso<12 && Date.now()-giuT<800){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    let c = el && el.closest ? el.closest(".carta") : null;
    if (!c){
      // ricaduta: se il tocco cade appena fuori dal bordo della carta centrale,
      // vale comunque per quella (la carta ruotata ha un riquadro più largo di lei)
      const f = carte[frontale()];
      const r = f.getBoundingClientRect();
      const dx = Math.max(r.left-e.clientX, 0, e.clientX-r.right);
      const dy = Math.max(r.top-e.clientY, 0, e.clientY-r.bottom);
      if (Math.hypot(dx,dy) < 40) c = f;
    }
    if (c && +c.style.opacity>0.55) apri(c.dataset.id);
  }
});
addEventListener("pointercancel", ()=>{ premuto=false; });

document.getElementById("bVideo").addEventListener("click", ()=> apri("video"));

document.getElementById("fSx").addEventListener("click", ()=> vaiA((frontale()+1)%SEZIONI.length));
document.getElementById("fDx").addEventListener("click", ()=> vaiA((frontale()-1+SEZIONI.length)%SEZIONI.length));
etichetta.addEventListener("click", ()=> apri(SEZIONI[frontale()].id));
carte.forEach(c=> c.addEventListener("keydown", e=>{

}));
addEventListener("keydown", e=>{

  if (e.key==="ArrowRight") vaiA((frontale()-1+SEZIONI.length)%SEZIONI.length);
});
addEventListener("pointermove", e=>{

});

const foglio=document.getElementById("foglio"), velo=document.getElementById("velo");
velo.addEventListener("click", chiudi);
function chiudi(){ foglio.classList.remove("aperto"); velo.classList.remove("aperto"); document.body.classList.remove("conFoglio"); }

function apri(id, forza){
  const percorso=["ottimismo","oroscopo","libri","ricette"];
  if (id===percorso[S.caccia]){ S.caccia++; if(S.caccia===4){S.caccia=0; trovato(1);} } else S.caccia=(id===percorso[0])?1:0;
  S.konami=[...S.konami,id].slice(-4);
  if (S.konami.join()==="frase,libri,viaggi,sorpresa"){ S.konami=[]; trovato(2); }

  foglio.innerHTML = `<button class="x" aria-label="Chiudi">✕</button>` + contenuto(id, forza);
  foglio.scrollTop=0;
  foglio.classList.add("aperto"); velo.classList.add("aperto"); document.body.classList.add("conFoglio");
  foglio.querySelector(".x").addEventListener("click", chiudi);
  const anc=foglio.querySelector(".ancora");
  if (anc) anc.addEventListener("click", ()=>apri(id,true));
  aggancia(id);
}

  if (id==="buste") foglio.querySelectorAll(".busta").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.i; if(S.buste.includes(i)) return;
    S.buste=[...S.buste,i]; salva("sara4:buste",S.buste); coriandoli(80); apri("buste"); statistiche(); }));
  if (id==="barattolo") foglio.querySelector(".salvaR").addEventListener("click",()=>{
    const ta=document.getElementById("nuovo"), t=ta.value.trim();
    if(!t){ta.focus();return;}
    S.barattolo=[...S.barattolo,{t,d:oggi.toLocaleDateString("it-IT")}];
    salva("sara4:barattolo",S.barattolo); coriandoli(70); apri("barattolo"); statistiche(); });
}

/* ═════════ AUDIO ═════════
   Uso i controlli nativi del browser: un <audio controls> per brano.
   È l'unico modo che non può essere bloccato dalle regole di riproduzione
   automatica, perché il play parte dal comando del browser stesso. */

function agganciaLettore(){
  const audio = [...foglio.querySelectorAll("audio")];
  // un brano alla volta: se ne parte uno, gli altri si fermano
  audio.forEach((a,i)=>{
    a.addEventListener("play", ()=> audio.forEach((b,j)=>{ if(j!==i) b.pause(); }));
    a.addEventListener("error", ()=>{
      const p = foglio.querySelector('[data-err="'+i+'"]');
      if (p) p.textContent = "⚠ file non trovato: " + BRANI[i].file;
    });
  });
  const bottone = document.getElementById("controlla");
  if (bottone) bottone.addEventListener("click", async ()=>{
    const esito = document.getElementById("esito");
    esito.innerHTML = '<p class="nota">Controllo in corso…</p>';
    const righe = [];
    for (const b of [VIDEO, ...BRANI]){
      const nome = b.file;
      let stato;
      try {
        const r = await fetch(nome, { method:"HEAD", cache:"no-store" });
        stato = r.ok ? "✅ trovato" : "❌ manca (errore " + r.status + ")";
      } catch { stato = "❌ non raggiungibile"; }
      righe.push('<p class="riga"><code>'+nome+'</code> '+stato+'</p>');
    }
    esito.innerHTML = '<div class="indizi"><h4>Esito del controllo</h4>'+righe.join("")+
      '<p class="nota">I file col ❌ non sono nella stessa cartella dell\'index.html, oppure hanno un nome diverso. Su GitHub maiuscole e minuscole contano.</p></div>';
  });
}

/* ═════════ CORIANDOLI ═════════ */
const cv=document.getElementById("coriandoli"), cx=cv.getContext("2d");
let W,H,pezzi=[]; const dpr=Math.min(devicePixelRatio||1,2);
const TINTE=["#F2726F","#FFB86B","#A88BEB","#5FD3C4","#FFD866","#FF9EC4","#7CA9F2"];
function dim(){ W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener("resize",dim); dim();
function coriandoli(n){
  if (ridotto) return;
  for(let i=0;i<n;i++) pezzi.push({x:W/2+(Math.random()-.5)*W*.5, y:H*.42+(Math.random()-.5)*90,
    vx:(Math.random()-.5)*13, vy:Math.random()*-15-4, w:5+Math.random()*8, h:3+Math.random()*6,
    ax:Math.random()*6.28, ay:Math.random()*6.28, vax:(Math.random()-.5)*.34, vay:(Math.random()-.5)*.3,
    c:TINTE[Math.floor(Math.random()*TINTE.length)], v:1});
}
(function animaC(){
  cx.clearRect(0,0,W,H);
  pezzi=pezzi.filter(p=>p.v>.02 && p.y<H+80);
  for(const p of pezzi){
    p.vy+=.33; p.x+=p.vx; p.y+=p.vy; p.vx*=.994; p.ax+=p.vax; p.ay+=p.vay;
    if(p.y>H*.72) p.v-=.013;
    const sx=Math.abs(Math.cos(p.ay));
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.ax); cx.globalAlpha=Math.max(p.v,0);
    cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w*Math.max(sx,.12),p.h);
    cx.fillStyle="rgba(0,0,0,.28)"; cx.fillRect(-p.w/2,-p.h/2,p.w*Math.max(sx,.12),p.h*.34);
    cx.restore();
  }
  requestAnimationFrame(animaC);
})();

const barra=document.getElementById("brindisi"); let tB;
function brindisi(t){ barra.textContent=t; barra.classList.add("su"); clearTimeout(tB); tB=setTimeout(()=>barra.classList.remove("su"),5200); }
if (!ridotto) setTimeout(()=>coriandoli(220), 500);
</script>
